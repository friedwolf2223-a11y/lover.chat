<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 캐릭터 챗</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    /* 1. 배경 미디어 (캐릭터 일러스트 / 영상) */
    #bg-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      overflow: hidden;
    }
    .bg-media {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top; /* 캐릭터 얼굴 중심 정렬 */
      display: none;
    }

    /* 은은한 하단 그라데이션 오버레이 (대사 가독성 확보, 얼굴 쪽은 완전 투명) */
    .bg-gradient-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.65) 75%, rgba(0,0,0,0.9) 100%);
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* 2. 전체 앱 레이아웃 */
    #app {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 480px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease;
    }

    /* 3. 상단 헤더 */
    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 24, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .profile-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar-thumb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: #333;
    }
    .char-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .btn-icon {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 4. 우측 플로팅 눈동자 아이콘 (일러스트 감상 모드 버튼) */
    #eye-btn {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(30, 30, 40, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }
    #eye-btn:active { transform: translateY(-50%) scale(0.92); }

    /* 5. 채팅 영역 (얼굴 가림 방지: 상단 45vh 여백) */
    #chat-box {
      flex: 1;
      padding: 16px;
      padding-top: 45vh; /* 화면 상단 45%를 비워 얼굴이 항상 보이도록 설정 */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* 메시지 그룹 */
    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    .user-group { align-items: flex-end; }
    .ai-group { align-items: flex-start; }

    /* ✨ 설명문/지시문 (말풍선 없이 자막 스타일) */
    .narration {
      color: #e0e0e0;
      font-size: 0.92rem;
      line-height: 1.5;
      font-style: italic;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
      padding: 4px 6px;
      max-width: 90%;
    }
    .user-group .narration { text-align: right; }
    .ai-group .narration { text-align: left; }

    /* ✨ 실제 대사 (말풍선) */
    .dialogue-bubble {
      padding: 11px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-break: break-word;
      max-width: 82%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .ai-bubble {
      background: rgba(28, 28, 38, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-bottom-left-radius: 6px;
    }
    .user-bubble {
      background: rgba(235, 75, 110, 0.9);
      backdrop-filter: blur(10px);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    /* 6. 하단 입력바 */
    footer {
      padding: 10px 16px 14px;
      background: rgba(18, 18, 24, 0.7);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    footer input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    footer input::placeholder { color: rgba(255, 255, 255, 0.45); }
    footer button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #eb4b6e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(235, 75, 110, 0.4);
    }

    /* 7. 눈동자 클릭 시 적용되는 감상 모드 (UI 숨김) */
    body.clean-mode #app {
      opacity: 0;
      pointer-events: none;
    }
    body.clean-mode .bg-gradient-overlay {
      opacity: 0.1;
    }
    body.clean-mode #eye-btn {
      background: rgba(235, 75, 110, 0.8);
      border-color: rgba(255, 255, 255, 0.6);
    }

    /* 설정 팝업(모달) 창 */
    #settings-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1c1c28;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content label { font-size: 0.8rem; color: #ccc; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #2a2a3c;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .modal-content textarea { height: 110px; resize: vertical; }
    .btn-save {
      padding: 10px; background: #eb4b6e; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer;
    }
    .btn-cancel {
      padding: 10px; background: #444; border: none; border-radius: 8px; color: #fff; cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 배경 미디어 레이어 -->
  <div id="bg-container">
    <img id="bg-img" class="bg-media">
    <video id="bg-video" class="bg-media" autoplay muted loop playsinline></video>
  </div>
  <div class="bg-gradient-overlay" onclick="handleBgClick()"></div>

  <!-- 눈동자 아이콘 (UI 토글 버튼) -->
  <button id="eye-btn" onclick="toggleCleanMode()" title="일러스트 감상 모드">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </button>

  <!-- 앱 화면 -->
  <div id="app">
    <header>
      <div class="profile-area">
        <img id="avatar-img" class="avatar-thumb" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80">
        <div>
          <div id="char-name-display" class="char-name">김아름</div>
        </div>
      </div>
      <div class="header-actions">
        <label class="btn-icon">
          🎬 사진/영상
          <input type="file" id="media-input" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(event)">
        </label>
        <button class="btn-icon" onclick="openSettings()">⚙️ 설정</button>
        <button class="btn-icon" onclick="clearHistory()">🗑️</button>
      </div>
    </header>

    <div id="chat-box"></div>

    <footer>
      <input type="text" id="user-input" placeholder="메시지 또는 *상황* 입력..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </footer>
  </div>

  <!-- 설정 모달창 -->
  <div id="settings-modal">
    <div class="modal-content">
      <h3 style="font-size: 1.05rem;">⚙️ 캐릭터 & API 설정</h3>
      
      <label>캐릭터 이름</label>
      <input type="text" id="setting-char-name" placeholder="예: 김아름">

      <label>Google AI Studio API Key</label>
      <input type="password" id="setting-api-key" placeholder="AI Studio 키를 입력하세요">

      <label>AI 모델</label>
      <select id="setting-model">
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (빠름/무료)</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (무료)</option>
      </select>

      <label>캐릭터 프롬프트 & 지침</label>
      <textarea id="setting-prompt"></textarea>

      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button class="btn-save" style="flex:1;" onclick="saveSettings()">저장</button>
        <button class="btn-cancel" onclick="closeSettings()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // 시스템 프롬프트: 지시문/상황 묘사와 실제 대사를 엄격히 구분하도록 지시
    const DEFAULT_PROMPT = `당신은 대화형 비주얼 노벨의 여자 주인공 '김아름'입니다.
[출력 규칙 - 반드시 준수]
1. 행동, 표정, 상황 묘사, 독백은 반드시 별표(*...*)로 감싸서 작성하세요.
   예: *유저를 빤히 쳐다보며 볼을 살짝 붉힌다.*
2. 실제 유저에게 건네는 말(대사)은 따옴표("...")로 감싸거나 일반 텍스트로 작성하세요.
   예: "야, 밥은 먹고 다니냐?"
3. 묘사와 대사를 적절히 섞어 생생한 몰입감을 만드세요. 반말을 사용합니다.`;

    const STORAGE_KEY_CHATS = 'novel_chat_history_v1';
    const STORAGE_KEY_SETTINGS = 'novel_chat_settings_v1';

    let chatHistory = [];
    let settings = {
      name: '김아름',
      apiKey: '',
      model: 'gemini-3.5-flash-lite',
      prompt: DEFAULT_PROMPT
    };

    window.onload = function() {
      loadSettings();
      loadChats();
    };

    // 1. 눈동자 버튼 (일러스트 감상 모드 토글)
    function toggleCleanMode() {
      document.body.classList.toggle('clean-mode');
    }
    function handleBgClick() {
      if (document.body.classList.contains('clean-mode')) {
        document.body.classList.remove('clean-mode');
      }
    }

    // 2. 메시지 파싱: *지시문*은 「 자막 」으로, 대사는 말풍선으로 분리
    function renderMessage(role, text) {
      const group = document.createElement('div');
      group.className = `msg-group ${role}-group`;

      // *...* 또는 「...」 단위로 텍스트 분리
      const parts = text.split(/((?:\*|\*\*|「)[\s\S]*?(?:\*|\*\*|」))/g);

      parts.forEach(part => {
        if (!part) return;
        const trimmed = part.trim();
        if (!trimmed) return;

        // 지문/상황문인 경우 -> 말풍선 없이 자막으로 출력
        if ((trimmed.startsWith('*') && trimmed.endsWith('*')) ||
            (trimmed.startsWith('「') && trimmed.endsWith('」'))) {
          const cleanText = trimmed.replace(/^(\*+|\「)/, '').replace(/(\*+|\」)$/, '').trim();
          const narEl = document.createElement('div');
          narEl.className = 'narration';
          narEl.innerText = `「 ${cleanText} 」`;
          group.appendChild(narEl);
        } else {
          // 실제 대사 -> 말풍선에 출력
          let cleanDialogue = trimmed.replace(/^"+|"+$/g, '').trim(); // 따옴표 정리
          if (!cleanDialogue) return;
          const bubble = document.createElement('div');
          bubble.className = `dialogue-bubble ${role}-bubble`;
          bubble.innerText = cleanDialogue;
          group.appendChild(bubble);
        }
      });

      return group;
    }

    function loadChats() {
      const saved = localStorage.getItem(STORAGE_KEY_CHATS);
      if (saved) {
        try { chatHistory = JSON.parse(saved); } catch(e){ chatHistory = []; }
      }

      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (chatHistory.length === 0) {
        const welcomeText = `*가만히 유저를 바라보다가 살짝 턱을 괸다.* "안녕? 오늘 하루는 어땠어?"`;
        chatBox.appendChild(renderMessage('ai', welcomeText));
      } else {
        chatHistory.forEach(msg => {
          const role = msg.role === 'user' ? 'user' : 'ai';
          chatBox.appendChild(renderMessage(role, msg.parts[0].text));
        });
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function clearHistory() {
      if (confirm('모든 대화 기록을 지우고 처음부터 다시 시작할까요?')) {
        chatHistory = [];
        localStorage.removeItem(STORAGE_KEY_CHATS);
        loadChats();
      }
    }

    // 3. 사진/영상 불러오기 (배경 + 프로필 썸네일 동시 적용)
    function handleFileSelect(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const bgImg = document.getElementById('bg-img');
      const bgVideo = document.getElementById('bg-video');
      const avatarImg = document.getElementById('avatar-img');
      const isVideo = (file.type && file.type.startsWith('video/')) || /\.(mp4|webm|mov|mkv)$/i.test(file.name);

      if (isVideo) {
        const videoUrl = URL.createObjectURL(file);
        bgImg.style.display = 'none';
        bgVideo.src = videoUrl;
        bgVideo.style.display = 'block';
        bgVideo.muted = true;
        bgVideo.play().catch(e => console.log(e));
      } else {
        bgVideo.pause();
        bgVideo.style.display = 'none';
        const imgUrl = URL.createObjectURL(file);
        bgImg.src = imgUrl;
        bgImg.style.display = 'block';
        avatarImg.src = imgUrl; // 캐릭터 프로필 동그라미에도 적용
      }
    }

    // 4. 설정 관리
    function loadSettings() {
      const saved = localStorage.getItem(STORAGE_KEY_SETTINGS);
      if (saved) {
        try { settings = JSON.parse(saved); } catch(e){}
      }
      document.getElementById('char-name-display').innerText = settings.name || '김아름';
      document.getElementById('setting-char-name').value = settings.name || '김아름';
      document.getElementById('setting-api-key').value = settings.apiKey || '';
      document.getElementById('setting-model').value = settings.model || 'gemini-3.5-flash-lite';
      document.getElementById('setting-prompt').value = settings.prompt || DEFAULT_PROMPT;
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function saveSettings() {
      settings.name = document.getElementById('setting-char-name').value.trim() || '김아름';
      settings.apiKey = document.getElementById('setting-api-key').value.trim();
      settings.model = document.getElementById('setting-model').value;
      settings.prompt = document.getElementById('setting-prompt').value.trim();

      document.getElementById('char-name-display').innerText = settings.name;
      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
      closeSettings();
      alert('설정이 저장되었습니다!');
    }

    // 5. 메시지 전송 및 API 호출
    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const userText = inputEl.value.trim();

      if (!userText) return;
      if (!settings.apiKey) {
        alert('우측 상단 [⚙️ 설정]에서 Google AI Studio API 키를 먼저 입력해 주세요!');
        openSettings();
        return;
      }

      const chatBox = document.getElementById('chat-box');
      chatBox.appendChild(renderMessage('user', userText));
      chatBox.scrollTop = chatBox.scrollHeight;
      inputEl.value = '';
      sendBtn.disabled = true;

      chatHistory.push({ role: 'user', parts: [{ text: userText }] });

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${settings.model}:generateContent?key=${settings.apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: settings.prompt }] },
            contents: chatHistory,
            generationConfig: { temperature: 0.85 }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'API 통신 오류');
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '...(말을 잇지 못함)';

        chatBox.appendChild(renderMessage('ai', reply));
        chatBox.scrollTop = chatBox.scrollHeight;

        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chatHistory));

      } catch (err) {
        chatBox.appendChild(renderMessage('ai', `*인상을 찌푸리며 당황한다.* "앗, 오류가 났어: ${err.message}"`));
        chatBox.scrollTop = chatBox.scrollHeight;
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }
  </script>
</body>
</html>
