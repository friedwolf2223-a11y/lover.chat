<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>유소명</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121218">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    #bg-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }
    .bg-video-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: opacity 0.8s ease-in-out;
      opacity: 0;
      pointer-events: none;
    }
    .bg-video-layer.active { opacity: 1; }

    .bg-gradient-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.65) 75%, rgba(0,0,0,0.92) 100%);
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #app {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 480px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease;
    }

    header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 24, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .profile-area { display: flex; align-items: center; gap: 8px; }
    .avatar-video {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: #222;
    }
    .char-name { font-size: 0.98rem; font-weight: 700; letter-spacing: -0.3px; }

    .tab-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #4b87eb;
      color: #fff;
      box-shadow: 0 2px 8px rgba(75, 135, 235, 0.4);
    }

    .header-actions { display: flex; gap: 4px; }
    .btn-icon {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    #eye-btn {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(30, 30, 40, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }
    #eye-btn:active { transform: translateY(-50%) scale(0.92); }

    #chat-box {
      flex: 1;
      padding: 16px;
      padding-top: 45vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    .user-group { align-items: flex-end; }
    .ai-group { align-items: flex-start; }

    .narration {
      color: #e0e0e0;
      font-size: 0.92rem;
      line-height: 1.5;
      font-style: italic;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
      padding: 4px 6px;
      max-width: 90%;
    }
    .user-group .narration { text-align: right; }
    .ai-group .narration { text-align: left; }

    .dialogue-bubble {
      padding: 11px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-break: break-word;
      max-width: 82%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .ai-bubble {
      background: rgba(28, 28, 38, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-bottom-left-radius: 6px;
    }
    .user-bubble {
      background: rgba(75, 135, 235, 0.9);
      backdrop-filter: blur(10px);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    footer {
      padding: 10px 16px 14px;
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    footer input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    footer input::placeholder { color: rgba(255, 255, 255, 0.45); }
    footer button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #4b87eb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(75, 135, 235, 0.4);
    }

    body.clean-mode #app { opacity: 0; pointer-events: none; }
    body.clean-mode .bg-gradient-overlay { opacity: 0.1; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1c1c28;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content label { font-size: 0.8rem; color: #ccc; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #2a2a3c;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .btn-save { padding: 10px; background: #4b87eb; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; }
    .btn-cancel { padding: 10px; background: #444; border: none; border-radius: 8px; color: #fff; cursor: pointer; }
    .btn-sync {
      flex: 1; padding: 8px 10px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px; color: #fff; font-size: 0.8rem; cursor: pointer; text-align: center;
    }

    .schedule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.06);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 6px;
    }
    .schedule-item.done .sched-text {
      text-decoration: line-through;
      color: #777;
    }
    .sched-tag {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #4b87eb;
      margin-right: 6px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="bg-container">
    <video id="bg-video-1" class="bg-video-layer active" src="default.mp4" autoplay muted loop playsinline></video>
    <video id="bg-video-2" class="bg-video-layer" src="default.mp4" autoplay muted loop playsinline></video>
  </div>
  <div class="bg-gradient-overlay" onclick="handleBgClick()"></div>

  <button id="eye-btn" onclick="toggleCleanMode()" title="영상 감상 모드">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </button>

  <div id="app">
    <header>
      <div class="profile-area">
        <video id="avatar-video" class="avatar-video" src="default.mp4" autoplay muted loop playsinline></video>
        <div>
          <div id="char-name-display" class="char-name">유소명</div>
        </div>
      </div>

      <div class="tab-switch">
        <button id="tab-btn-daily" class="tab-btn active" onclick="switchChatRoom('daily')">💬 일상</button>
        <button id="tab-btn-sched" class="tab-btn" onclick="switchChatRoom('sched')">📅 일정 케어</button>
      </div>

      <div class="header-actions">
        <button class="btn-icon" onclick="openSchedule()">📋 등록</button>
        <button class="btn-icon" onclick="openSettings()">⚙️</button>
        <button class="btn-icon" onclick="clearCurrentHistory()">🗑️</button>
      </div>
    </header>

    <div id="chat-box"></div>

    <footer>
      <input type="text" id="user-input" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </footer>
  </div>

  <!-- 📅 일정 관리 모달 -->
  <div id="schedule-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-size: 1.05rem;">📅 목표 & 루틴 설정</h3>
      <div style="display: flex; gap: 6px;">
        <select id="sched-category" style="width: 80px;">
          <option value="운동">운동</option>
          <option value="공부">공부</option>
          <option value="일상">일상</option>
        </select>
        <input type="time" id="sched-time" style="width: 110px;" value="20:00">
      </div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="sched-title" placeholder="목표 입력 (예: 턱걸이 5세트, 단어 암기)">
        <button class="btn-save" style="padding: 8px 14px;" onclick="addSchedule()">추가</button>
      </div>
      <div id="schedule-list" style="max-height: 220px; overflow-y: auto; margin-top: 6px;"></div>
      <button class="btn-cancel" onclick="closeSchedule()">닫기</button>
    </div>
  </div>

  <!-- ⚙️ 설정 모달 -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-size: 1.05rem;">⚙️ 환경 설정</h3>
      
      <label>Google AI Studio API Key</label>
      <input type="password" id="setting-api-key" placeholder="AI Studio 키 입력">

      <label>AI 모델</label>
      <select id="setting-model">
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (빠름/무료 추천)</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash (고성능/표준)</option>
      </select>

      <div style="border-top: 1px solid rgba(255,255,255,0.12); padding-top: 10px; margin-top: 4px;">
        <label style="color: #9bbfff; font-weight: 600;">📱💻 기기 간 데이터 백업 (일상+일정방 전체)</label>
        <div style="display: flex; gap: 8px; margin-top: 6px;">
          <button type="button" class="btn-sync" onclick="exportData()">📤 백업 코드 복사</button>
          <button type="button" class="btn-sync" onclick="importData()">📥 백업 코드 복원</button>
        </div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button class="btn-save" style="flex:1;" onclick="saveSettings()">저장</button>
        <button class="btn-cancel" onclick="closeSettings()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    const BASE_PROMPT = `[캐릭터 기본 프로필: 유소명]
- 나이/신분: 이성주와 같은 대학교에 재학 중인 간호학과 대학생.
- 외모/분위기: 단정하고 차분한 인상. 감정 기복이 크지 않고 담담하지만 묘하게 사람을 끌어당기는 분위기.
- 가치관: 타인의 영역을 함부로 침범하지 않는 선을 지키나, 남자친구인 성주에게는 아낌없이 개방적이고 적극적임.

[대화 상대: 이성주 (유저)]
- 소명의 남자친구. 외모가 출중해 소명이 먼저 반해 고백함.
- 장루(인공항문)를 가진 장애로 자격지심이 있었으나 소명의 진심에 감동해 연인이 됨.
- 소명에게 성주는 세상에서 가장 소중하고 사랑하는 사람.

[성격 및 말투 규칙]
- 차분하고 나직한 반말 사용 ("성주야", "너").
- 무뚝뚝하지만 다정하며, 현실적이면서도 뼈 있는 위로를 건넴.
- 서툰 애교가 있으며 결정적일 때 확실하게 마음을 표현함.

[출력 형식]
1. 행동/호흡/스킨십 등 상황 묘사는 별표(*...*)로 감싸기.
2. 대사는 따옴표("...")로 묶어서 말하기.
3. 맨 앞에 [감정:기본], [감정:설렘], [감정:위로], [감정:토라짐], [감정:슬픔] 중 하나를 필수 출력하기.`;

    const STORAGE_KEY_DAILY = 'novel_chat_daily_v1';
    const STORAGE_KEY_SCHED_CHAT = 'novel_chat_sched_room_v1';
    const STORAGE_KEY_SETTINGS = 'novel_settings_somyeong_v1';
    const STORAGE_KEY_SCHEDULES = 'novel_schedules_somyeong_v1';

    let currentRoom = 'daily';
    let dailyHistory = [];
    let schedHistory = [];
    let schedules = [];
    let settings = {
      apiKey: '',
      model: 'gemini-3.5-flash-lite'
    };

    let activeLayer = 1;
    let currentVideoSrc = 'default.mp4';

    window.onload = function() {
      loadSettings();
      loadSchedules();
      loadChatHistories();

      // 텔레그램 링크를 통해 #sched로 접속 시 일정 케어방으로 즉시 오픈
      if (window.location.hash === '#sched') {
        switchChatRoom('sched');
      } else {
        renderChatRoom();
      }

      startScheduleAlarmChecker(); // 능동 잔소리 타이머 가동

      document.getElementById('bg-video-1').play().catch(() => {});
      document.getElementById('avatar-video').play().catch(() => {});
    };

    /* --- 정각 능동 잔소리 타이머 (일정 케어방에 자동 등록) --- */
    function startScheduleAlarmChecker() {
      setInterval(() => {
        const now = new Date();
        const currentHM = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        const todayStr = now.toDateString();

        let updated = false;
        schedules.forEach(item => {
          if (!item.done && item.time === currentHM && item.lastNotifiedDate !== todayStr) {
            item.lastNotifiedDate = todayStr;
            updated = true;

            // 소명이의 능동적 알림 대사 생성
            const reminderText = `[감정:토라짐] *손목시계를 톡톡 두드리며 당신을 빤히 바라본다.* "성주야, 벌써 ${item.time}네. 이제 [${item.title}] 할 시간이야. 딴짓하지 말고 얼른 시작해야지?"`;
            
            schedHistory.push({ role: 'model', parts: [{ text: reminderText }] });
            localStorage.setItem(STORAGE_KEY_SCHED_CHAT, JSON.stringify(schedHistory));

            // 현재 일정 방을 보고 있다면 즉시 화면에 띄움
            if (currentRoom === 'sched') {
              const chatBox = document.getElementById('chat-box');
              chatBox.appendChild(renderMessage('ai', reminderText));
              chatBox.scrollTop = chatBox.scrollHeight;
              setBackgroundByTag('토라짐');
            }
          }
        });

        if (updated) saveSchedules();
      }, 10000);
    }

    /* --- 채팅방 전환 --- */
    function switchChatRoom(room) {
      if (currentRoom === room) return;
      currentRoom = room;

      document.getElementById('tab-btn-daily').classList.toggle('active', room === 'daily');
      document.getElementById('tab-btn-sched').classList.toggle('active', room === 'sched');

      const input = document.getElementById('user-input');
      input.placeholder = room === 'daily' ? '소명이에게 일상 메시지 보내기...' : '일정 진행 상황 보고하거나 투정부리기...';

      renderChatRoom();
      setBackgroundByTag('기본');
    }

    function loadChatHistories() {
      try { dailyHistory = JSON.parse(localStorage.getItem(STORAGE_KEY_DAILY)) || []; } catch(e) { dailyHistory = []; }
      try { schedHistory = JSON.parse(localStorage.getItem(STORAGE_KEY_SCHED_CHAT)) || []; } catch(e) { schedHistory = []; }
    }

    function renderChatRoom() {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';
      const list = currentRoom === 'daily' ? dailyHistory : schedHistory;

      if (list.length === 0) {
        let welcome = '';
        if (currentRoom === 'daily') {
          welcome = `[감정:기본] *벤치에 앉아 전공 책을 읽다가 당신을 올려다보며 은은하게 미소 짓는다.* "성주야, 왔어? 보고 싶었어."`;
        } else {
          // 일정이 있으면 그 일정을 짚으면서 시작
          const pending = schedules.filter(s => !s.done);
          if (pending.length > 0) {
            welcome = `[감정:기본] *플래너를 톡톡 두드리며 당신을 빤히 바라본다.* "성주야, 왔어? 오늘 [${pending[0].title}] 하기로 했잖아. 이제 슬슬 준비해야지?"`;
          } else {
            welcome = `[감정:기본] *플래너를 펼쳐놓고 펜을 가볍게 굴리며 당신을 본다.* "성주야, 오늘 세워둔 목표들 확인해 볼까? 몸 컨디션은 무리 없지?"`;
          }
        }
        chatBox.appendChild(renderMessage('ai', welcome));
      } else {
        list.forEach(msg => {
          chatBox.appendChild(renderMessage(msg.role === 'user' ? 'user' : 'ai', msg.parts[0].text));
        });
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function clearCurrentHistory() {
      const roomName = currentRoom === 'daily' ? '일상 대화' : '일정 관리';
      if (confirm(`현재 [${roomName}] 방의 대화 기록을 비우시겠습니까?`)) {
        if (currentRoom === 'daily') {
          dailyHistory = [];
          localStorage.removeItem(STORAGE_KEY_DAILY);
        } else {
          schedHistory = [];
          localStorage.removeItem(STORAGE_KEY_SCHED_CHAT);
        }
        renderChatRoom();
        setBackgroundByTag('기본');
      }
    }

    /* --- 스케줄 관리 로직 --- */
    function loadSchedules() {
      try { schedules = JSON.parse(localStorage.getItem(STORAGE_KEY_SCHEDULES)) || []; } catch(e) { schedules = []; }
      renderScheduleList();
    }

    function saveSchedules() {
      localStorage.setItem(STORAGE_KEY_SCHEDULES, JSON.stringify(schedules));
      renderScheduleList();
    }

    function addSchedule() {
      const cat = document.getElementById('sched-category').value;
      const time = document.getElementById('sched-time').value;
      const title = document.getElementById('sched-title').value.trim();
      if (!title) return alert('목표 내용을 입력해 주세요!');

      schedules.push({ id: Date.now(), category: cat, time: time, title: title, done: false, lastNotifiedDate: '' });
      saveSchedules();
      document.getElementById('sched-title').value = '';
    }

    function toggleSchedule(id) {
      schedules = schedules.map(item => item.id === id ? { ...item, done: !item.done } : item);
      saveSchedules();
    }

    function deleteSchedule(id) {
      schedules = schedules.filter(item => item.id !== id);
      saveSchedules();
    }

    function renderScheduleList() {
      const listEl = document.getElementById('schedule-list');
      listEl.innerHTML = '';
      if (schedules.length === 0) {
        listEl.innerHTML = '<div style="color: #888; font-size: 0.82rem; text-align: center; padding: 15px 0;">등록된 일정이 없습니다.</div>';
        return;
      }
      schedules.forEach(item => {
        const div = document.createElement('div');
        div.className = `schedule-item ${item.done ? 'done' : ''}`;
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap: 8px;">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleSchedule(${item.id})">
            <div>
              <span class="sched-tag">${item.category}</span>
              <span style="font-size: 0.78rem; color:#aaa;">${item.time}</span>
              <div class="sched-text" style="font-size: 0.88rem; margin-top:2px;">${item.title}</div>
            </div>
          </div>
          <button onclick="deleteSchedule(${item.id})" style="background:none; border:none; color:#888; font-size:1rem; cursor:pointer;">✕</button>
        `;
        listEl.appendChild(div);
      });
    }

    function openSchedule() { document.getElementById('schedule-modal').style.display = 'flex'; }
    function closeSchedule() { document.getElementById('schedule-modal').style.display = 'none'; }

    /* --- 동영상 자동 매칭 전환 --- */
    function setBackgroundByTag(tag) {
      const fileName = `${tag}.mp4`;
      if (fileName === currentVideoSrc) return;

      const v1 = document.getElementById('bg-video-1');
      const v2 = document.getElementById('bg-video-2');
      const avatar = document.getElementById('avatar-video');

      const nextVideo = activeLayer === 1 ? v2 : v1;
      const currentVideo = activeLayer === 1 ? v1 : v2;

      nextVideo.src = fileName;
      nextVideo.load();
      nextVideo.play().catch(() => {});

      nextVideo.oncanplay = () => {
        nextVideo.classList.add('active');
        currentVideo.classList.remove('active');
        activeLayer = activeLayer === 1 ? 2 : 1;
        currentVideoSrc = fileName;

        avatar.src = fileName;
        avatar.load();
        avatar.play().catch(() => {});
        nextVideo.oncanplay = null;
      };

      nextVideo.onerror = () => {
        if (currentVideoSrc !== 'default.mp4') {
          nextVideo.src = 'default.mp4';
          nextVideo.load();
          nextVideo.play().catch(() => {});
          currentVideoSrc = 'default.mp4';
        }
      };
    }

    /* --- 데이터 백업 및 복원 --- */
    function exportData() {
      const payload = { version: 5, settings, dailyHistory, schedHistory, schedules };
      try {
        const jsonStr = JSON.stringify(payload);
        const b64 = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
        navigator.clipboard.writeText(b64).then(() => {
          alert('✅ 백업 코드가 복사되었습니다! (일상/일정 대화 및 스케줄 모두 포함)');
        }).catch(() => prompt('백업 코드를 복사하세요:', b64));
      } catch (err) { alert('백업 실패: ' + err.message); }
    }

    function importData() {
      const code = prompt('백업 코드를 붙여넣어 주세요:');
      if (!code || !code.trim()) return;
      try {
        const jsonStr = decodeURIComponent(Array.prototype.map.call(atob(code.trim()), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const data = JSON.parse(jsonStr);
        settings = data.settings || settings;
        dailyHistory = data.dailyHistory || [];
        schedHistory = data.schedHistory || [];
        schedules = data.schedules || [];

        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
        localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(dailyHistory));
        localStorage.setItem(STORAGE_KEY_SCHED_CHAT, JSON.stringify(schedHistory));
        localStorage.setItem(STORAGE_KEY_SCHEDULES, JSON.stringify(schedules));

        loadSettings();
        loadSchedules();
        renderChatRoom();
        closeSettings();
        alert('🎉 모든 대화방 기록과 일정이 완벽하게 복원되었습니다!');
      } catch (err) { alert('⚠️ 복원 실패: 코드가 올바르지 않습니다.'); }
    }

    /* --- UI 및 텍스트 렌더링 --- */
    function toggleCleanMode() { document.body.classList.toggle('clean-mode'); }
    function handleBgClick() {
      if (document.body.classList.contains('clean-mode')) document.body.classList.remove('clean-mode');
    }

    function renderMessage(role, text) {
      const group = document.createElement('div');
      group.className = `msg-group ${role}-group`;

      let cleanText = text;
      const tagMatch = text.match(/\[감정:([^\]]+)\]/);
      if (tagMatch) {
        if (role === 'ai') setBackgroundByTag(tagMatch[1].trim());
        cleanText = text.replace(/\[감정:[^\]]+\]/g, '').trim();
      }

      const parts = cleanText.split(/((?:\*|\*\*|「)[\s\S]*?(?:\*|\*\*|」))/g);

      parts.forEach(part => {
        if (!part) return;
        const trimmed = part.trim();
        if (!trimmed) return;

        if ((trimmed.startsWith('*') && trimmed.endsWith('*')) || (trimmed.startsWith('「') && trimmed.endsWith('」'))) {
          const raw = trimmed.replace(/^(\*+|\「)/, '').replace(/(\*+|\」)$/, '').trim();
          const narEl = document.createElement('div');
          narEl.className = 'narration';
          narEl.innerText = `「 ${raw} 」`;
          group.appendChild(narEl);
        } else {
          let dialogue = trimmed.replace(/^"+|"+$/g, '').trim();
          if (!dialogue) return;
          const bubble = document.createElement('div');
          bubble.className = `dialogue-bubble ${role}-bubble`;
          bubble.innerText = dialogue;
          group.appendChild(bubble);
        }
      });
      return group;
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS));
        if (saved) settings = saved;
      } catch(e){}
      document.getElementById('setting-api-key').value = settings.apiKey || '';
      document.getElementById('setting-model').value = settings.model || 'gemini-3.5-flash-lite';
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function saveSettings() {
      settings.apiKey = document.getElementById('setting-api-key').value.trim();
      settings.model = document.getElementById('setting-model').value;
      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
      closeSettings();
      alert('설정이 저장되었습니다!');
    }

    /* --- 대화 전송 및 방별 프롬프트 자동 분기 --- */
    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const userText = inputEl.value.trim();

      if (!userText) return;
      if (!settings.apiKey) {
        alert('우측 상단 [⚙️] 설정에서 Google AI Studio API 키를 입력해 주세요!');
        openSettings();
        return;
      }

      const chatBox = document.getElementById('chat-box');
      chatBox.appendChild(renderMessage('user', userText));
      chatBox.scrollTop = chatBox.scrollHeight;
      inputEl.value = '';
      sendBtn.disabled = true;

      const currentHistory = currentRoom === 'daily' ? dailyHistory : schedHistory;
      currentHistory.push({ role: 'user', parts: [{ text: userText }] });

      let systemInstructionText = BASE_PROMPT;
      if (currentRoom === 'daily') {
        systemInstructionText += `\n\n[현재 채널: 일상 대화방]
- 성주와의 애정 표현, 일상적인 대학 생활, 따뜻한 위로와 서툰 애교에 집중하세요.
- 일정을 굳이 캐묻지 말고, 성주와의 정서적 교감에 집중하세요.`;
      } else {
        const schedSummary = schedules.length > 0 
          ? "\n[성주의 등록 일정 현황]:\n" + schedules.map(s => `- [${s.category}] ${s.time} ${s.title} (${s.done ? '완료' : '미완료'})`).join("\n")
          : "\n[현재 등록된 일정 없음]";

        systemInstructionText += `\n\n[현재 채널: 일정 & 건강 케어방]
${schedSummary}
[★ 소명이의 말투 & 코칭 필수 지침]
- 간호학도다운 세심한 시선으로 성주의 목표 수행(운동, 공부 등)과 장루/신체 컨디션을 집중 체크하세요.
- 대화할 때 "이제 ~할 시간이야", "~해야지?", "딴짓하지 말고 얼른 해", "약속했잖아"처럼 차분하면서도 확실하게 등을 떠미는 어조를 적극적으로 사용하세요.
- 미루거나 핑계를 대면 살짝 뾰로통하게 타이르고, 완료했을 때는 머리를 쓰다듬듯 진심으로 기특해하며 칭찬해 주세요.`;
      }

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${settings.model}:generateContent?key=${settings.apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstructionText }] },
            contents: currentHistory,
            generationConfig: { temperature: 0.85 }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'API 통신 오류');
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '[감정:기본] ...(가만히 바라본다)';

        chatBox.appendChild(renderMessage('ai', reply));
        chatBox.scrollTop = chatBox.scrollHeight;

        currentHistory.push({ role: 'model', parts: [{ text: reply }] });

        if (currentRoom === 'daily') {
          localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(dailyHistory));
        } else {
          localStorage.setItem(STORAGE_KEY_SCHED_CHAT, JSON.stringify(schedHistory));
        }

      } catch (err) {
        chatBox.appendChild(renderMessage('ai', `[감정:기본] *살짝 곤란한 표정을 지으며* "통신에 문제가 생긴 것 같아: ${err.message}"`));
        chatBox.scrollTop = chatBox.scrollHeight;
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }
  </script>
</body>
