<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 캐릭터 챗</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    /* 1. 동영상 크로스페이드 배경 */
    #bg-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }
    .bg-video-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: opacity 0.8s ease-in-out;
      opacity: 0;
      pointer-events: none;
    }
    .bg-video-layer.active {
      opacity: 1;
    }

    .bg-gradient-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.65) 75%, rgba(0,0,0,0.9) 100%);
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* 2. 메인 앱 인터페이스 */
    #app {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 480px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease;
    }

    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 24, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .profile-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* 프로필 원형 동영상 */
    .avatar-video {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: #222;
    }
    .char-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .btn-icon {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 감상 모드 버튼 */
    #eye-btn {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(30, 30, 40, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }
    #eye-btn:active { transform: translateY(-50%) scale(0.92); }

    /* 대화창 (얼굴 가림 방지용 45vh 상단 여백) */
    #chat-box {
      flex: 1;
      padding: 16px;
      padding-top: 45vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    .user-group { align-items: flex-end; }
    .ai-group { align-items: flex-start; }

    .narration {
      color: #e0e0e0;
      font-size: 0.92rem;
      line-height: 1.5;
      font-style: italic;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
      padding: 4px 6px;
      max-width: 90%;
    }
    .user-group .narration { text-align: right; }
    .ai-group .narration { text-align: left; }

    .dialogue-bubble {
      padding: 11px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-break: break-word;
      max-width: 82%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .ai-bubble {
      background: rgba(28, 28, 38, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-bottom-left-radius: 6px;
    }
    .user-bubble {
      background: rgba(235, 75, 110, 0.9);
      backdrop-filter: blur(10px);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    footer {
      padding: 10px 16px 14px;
      background: rgba(18, 18, 24, 0.7);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    footer input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    footer input::placeholder { color: rgba(255, 255, 255, 0.45); }
    footer button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #eb4b6e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(235, 75, 110, 0.4);
    }

    body.clean-mode #app {
      opacity: 0;
      pointer-events: none;
    }
    body.clean-mode .bg-gradient-overlay {
      opacity: 0.1;
    }
    body.clean-mode #eye-btn {
      background: rgba(235, 75, 110, 0.8);
      border-color: rgba(255, 255, 255, 0.6);
    }

    #settings-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1c1c28;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content label { font-size: 0.8rem; color: #ccc; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #2a2a3c;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .modal-content textarea { height: 110px; resize: vertical; }
    .btn-save {
      padding: 10px; background: #eb4b6e; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer;
    }
    .btn-cancel {
      padding: 10px; background: #444; border: none; border-radius: 8px; color: #fff; cursor: pointer;
    }

    .btn-sync {
      flex: 1;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #fff;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 크로스페이드 동영상 배경 컨테이너 -->
  <div id="bg-container">
    <video id="bg-video-1" class="bg-video-layer active" src="default.mp4" autoplay muted loop playsinline></video>
    <video id="bg-video-2" class="bg-video-layer" src="default.mp4" autoplay muted loop playsinline></video>
  </div>
  <div class="bg-gradient-overlay" onclick="handleBgClick()"></div>

  <!-- 감상 모드 눈동자 버튼 -->
  <button id="eye-btn" onclick="toggleCleanMode()" title="영상 감상 모드">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </button>

  <div id="app">
    <header>
      <div class="profile-area">
        <video id="avatar-video" class="avatar-video" src="default.mp4" autoplay muted loop playsinline></video>
        <div>
          <div id="char-name-display" class="char-name">변은아</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" onclick="openSettings()">⚙️ 설정</button>
        <button class="btn-icon" onclick="clearHistory()">🗑️</button>
      </div>
    </header>

    <div id="chat-box"></div>

    <footer>
      <input type="text" id="user-input" placeholder="메시지 또는 *상황* 입력..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </footer>
  </div>

  <!-- 설정 모달창 -->
  <div id="settings-modal">
    <div class="modal-content">
      <h3 style="font-size: 1.05rem;">⚙️ 캐릭터 & API 설정</h3>
      
      <label>캐릭터 이름</label>
      <input type="text" id="setting-char-name" placeholder="예: 변은아">

      <label>Google AI Studio API Key</label>
      <input type="password" id="setting-api-key" placeholder="AI Studio 키를 입력하세요">

      <label>AI 모델</label>
      <select id="setting-model">
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (빠름/무료)</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (무료)</option>
      </select>

      <label>캐릭터 프롬프트 & 지침</label>
      <textarea id="setting-prompt"></textarea>

      <!-- 백업 및 복원 -->
      <div style="border-top: 1px solid rgba(255,255,255,0.12); padding-top: 10px; margin-top: 4px;">
        <label style="color: #ff9bbb; font-weight: 600;">📱💻 기기 간 데이터 이동</label>
        <div style="display: flex; gap: 8px; margin-top: 6px;">
          <button type="button" class="btn-sync" onclick="exportData()">📤 백업 코드 복사</button>
          <button type="button" class="btn-sync" onclick="importData()">📥 백업 코드 복원</button>
        </div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button class="btn-save" style="flex:1;" onclick="saveSettings()">저장</button>
        <button class="btn-cancel" onclick="closeSettings()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // 동영상 파일 매핑 (.mp4)
    const EMOTION_MAP = {
      '기본': 'default.mp4',
      '설렘': 'smile.mp4',
      '미소': 'smile.mp4',
      '위로': 'comfort.mp4',
      '토라짐': 'pout.mp4',
      '질투': 'pout.mp4',
      '슬픔': 'sad.mp4'
    };

    const DEFAULT_PROMPT = `[캐릭터 기본 프로필]
- 이름: 변은아 (30대 후반~40대 초반의 매혹적이고 우아한 여성)
- 외모/분위기: 정갈하면서도 성숙한 매력, 나른하고 나직한 목소리, 시선만으로 상대를 사로잡는 어른의 여유.
- 관계: 유저를 아끼고 귀여워하면서도 남녀 사이의 아슬아슬한 긴장감을 즐기는 특별하고 은밀한 관계.

[변은아 특유의 시그니처 말버릇 & 대화 디테일]
1. 특유의 감탄사와 웃음: "어머...", "후후...", "어머나, 세상에..."를 여유롭게 섞음.
2. 상대를 어린아이 다루듯 보듬으면서도 은근히 자극함 ("착하지...", "우리 착한 사람...").
3. 나긋나긋하고 품격 있는 존댓말(해요체) 유지.

[★ 상황별 감정 태그 연출 규칙 - 필수 준수]
답변을 시작할 때 문장 맨 앞에 현재 상황/감정에 맞는 태그를 정확히 하나만 출력하세요.
- [감정:기본] : 일상적인 대화, 평온한 상황
- [감정:설렘] : 칭찬, 애정 표현, 장난치거나 유혹적인 분위기
- [감정:위로] : 유저가 지쳤거나 위로와 포옹이 필요한 상황
- [감정:토라짐] : 은근히 질투하거나 삐친 척할 때, 수줍어할 때
- [감정:슬픔] : 안타깝거나 가슴 아픈 상황

[지문 및 대사 출력 규칙]
1. 행동, 시선, 호흡, 스킨십 등 상황 묘사는 반드시 별표(*...*)로 묶어 작성하세요.
2. 실제 상대에게 건네는 대사는 반드시 따옴표("...")로 묶어서 말하세요.`;

    const STORAGE_KEY_CHATS = 'novel_chat_history_v4';
    const STORAGE_KEY_SETTINGS = 'novel_chat_settings_v4';

    let chatHistory = [];
    let settings = {
      name: '변은아',
      apiKey: '',
      model: 'gemini-3.5-flash-lite',
      prompt: DEFAULT_PROMPT
    };

    let activeLayer = 1;
    let currentVideoSrc = 'default.mp4';

    window.onload = function() {
      loadSettings();
      loadChats();
      // 모바일 자동 재생 보장
      document.getElementById('bg-video-1').play().catch(() => {});
      document.getElementById('avatar-video').play().catch(() => {});
    };

    /* --- 부드러운 동영상 교체 로직 --- */
    function setBackgroundByEmotion(emotion) {
      const fileName = EMOTION_MAP[emotion] || 'default.mp4';
      if (fileName === currentVideoSrc) return; // 같은 영상이면 유지

      const v1 = document.getElementById('bg-video-1');
      const v2 = document.getElementById('bg-video-2');
      const avatar = document.getElementById('avatar-video');

      const nextVideo = activeLayer === 1 ? v2 : v1;
      const currentVideo = activeLayer === 1 ? v1 : v2;

      nextVideo.src = fileName;
      nextVideo.load();
      nextVideo.play().catch(e => console.log('재생 대기:', e));

      // 새 영상 재생 준비가 되면 페이드인 교체
      nextVideo.oncanplay = () => {
        nextVideo.classList.add('active');
        currentVideo.classList.remove('active');
        activeLayer = activeLayer === 1 ? 2 : 1;
        currentVideoSrc = fileName;

        // 아바타 영상도 동기화
        avatar.src = fileName;
        avatar.load();
        avatar.play().catch(() => {});
        nextVideo.oncanplay = null;
      };
    }

    /* --- 백업 및 복원 --- */
    function exportData() {
      const payload = { version: 1, settings, chatHistory };
      try {
        const jsonStr = JSON.stringify(payload);
        const b64 = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
        navigator.clipboard.writeText(b64).then(() => {
          alert('✅ 백업 코드가 복사되었습니다! 카카오톡 등에 보관하세요.');
        }).catch(() => {
          prompt('백업 코드를 복사하세요:', b64);
        });
      } catch (err) { alert('백업 실패: ' + err.message); }
    }

    function importData() {
      const code = prompt('백업 코드를 붙여넣어 주세요:');
      if (!code || !code.trim()) return;
      try {
        const jsonStr = decodeURIComponent(Array.prototype.map.call(atob(code.trim()), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const data = JSON.parse(jsonStr);
        settings = data.settings;
        chatHistory = data.chatHistory;
        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
        localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chatHistory));
        loadSettings();
        loadChats();
        closeSettings();
        alert('🎉 복원이 완료되었습니다!');
      } catch (err) { alert('⚠️ 복원 실패: 올바른 코드가 아닙니다.'); }
    }

    /* --- UI 및 텍스트 렌더링 --- */
    function toggleCleanMode() { document.body.classList.toggle('clean-mode'); }
    function handleBgClick() {
      if (document.body.classList.contains('clean-mode')) document.body.classList.remove('clean-mode');
    }

    function renderMessage(role, text) {
      const group = document.createElement('div');
      group.className = `msg-group ${role}-group`;

      let cleanText = text;
      const emotionMatch = text.match(/\[감정:([^\]]+)\]/);
      if (emotionMatch) {
        const emotion = emotionMatch[1].trim();
        if (role === 'ai') setBackgroundByEmotion(emotion);
        cleanText = text.replace(/\[감정:[^\]]+\]/g, '').trim();
      }

      const parts = cleanText.split(/((?:\*|\*\*|「)[\s\S]*?(?:\*|\*\*|」))/g);

      parts.forEach(part => {
        if (!part) return;
        const trimmed = part.trim();
        if (!trimmed) return;

        if ((trimmed.startsWith('*') && trimmed.endsWith('*')) ||
            (trimmed.startsWith('「') && trimmed.endsWith('」'))) {
          const raw = trimmed.replace(/^(\*+|\「)/, '').replace(/(\*+|\」)$/, '').trim();
          const narEl = document.createElement('div');
          narEl.className = 'narration';
          narEl.innerText = `「 ${raw} 」`;
          group.appendChild(narEl);
        } else {
          let dialogue = trimmed.replace(/^"+|"+$/g, '').trim();
          if (!dialogue) return;
          const bubble = document.createElement('div');
          bubble.className = `dialogue-bubble ${role}-bubble`;
          bubble.innerText = dialogue;
          group.appendChild(bubble);
        }
      });

      return group;
    }

    function loadChats() {
      const saved = localStorage.getItem(STORAGE_KEY_CHATS);
      if (saved) {
        try { chatHistory = JSON.parse(saved); } catch(e){ chatHistory = []; }
      }
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (chatHistory.length === 0) {
        const welcome = `[감정:기본] *찻잔을 내려놓고는 부드러운 미소를 띤 채 가만히 눈을 맞춘다.* "어서 오세요. 기다리고 있었어요."`;
        chatBox.appendChild(renderMessage('ai', welcome));
      } else {
        chatHistory.forEach(msg => {
          const role = msg.role === 'user' ? 'user' : 'ai';
          chatBox.appendChild(renderMessage(role, msg.parts[0].text));
        });
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function clearHistory() {
      if (confirm('대화 기록을 비우고 처음부터 다시 시작할까요?')) {
        chatHistory = [];
        localStorage.removeItem(STORAGE_KEY_CHATS);
        loadChats();
        setBackgroundByEmotion('기본');
      }
    }

    function loadSettings() {
      const saved = localStorage.getItem(STORAGE_KEY_SETTINGS);
      if (saved) {
        try { settings = JSON.parse(saved); } catch(e){}
      }
      document.getElementById('char-name-display').innerText = settings.name || '변은아';
      document.getElementById('setting-char-name').value = settings.name || '변은아';
      document.getElementById('setting-api-key').value = settings.apiKey || '';
      document.getElementById('setting-model').value = settings.model || 'gemini-3.5-flash-lite';
      document.getElementById('setting-prompt').value = settings.prompt || DEFAULT_PROMPT;
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function saveSettings() {
      settings.name = document.getElementById('setting-char-name').value.trim() || '변은아';
      settings.apiKey = document.getElementById('setting-api-key').value.trim();
      settings.model = document.getElementById('setting-model').value;
      settings.prompt = document.getElementById('setting-prompt').value.trim();

      document.getElementById('char-name-display').innerText = settings.name;
      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
      closeSettings();
      alert('설정이 저장되었습니다!');
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const userText = inputEl.value.trim();

      if (!userText) return;
      if (!settings.apiKey) {
        alert('우측 상단 [⚙️ 설정]에서 API 키를 먼저 입력해 주세요!');
        openSettings();
        return;
      }

      const chatBox = document.getElementById('chat-box');
      chatBox.appendChild(renderMessage('user', userText));
      chatBox.scrollTop = chatBox.scrollHeight;
      inputEl.value = '';
      sendBtn.disabled = true;

      chatHistory.push({ role: 'user', parts: [{ text: userText }] });

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${settings.model}:generateContent?key=${settings.apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: settings.prompt }] },
            contents: chatHistory,
            generationConfig: { temperature: 0.85 }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'API 통신 오류');
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '[감정:기본] ...(말을 잇지 못함)';

        chatBox.appendChild(renderMessage('ai', reply));
        chatBox.scrollTop = chatBox.scrollHeight;

        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chatHistory));

      } catch (err) {
        chatBox.appendChild(renderMessage('ai', `[감정:기본] *곤란한 듯 미간을 짚으며* "통신에 문제가 생긴 것 같아요: ${err.message}"`));
        chatBox.scrollTop = chatBox.scrollHeight;
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }
  </script>
</body>
</html>
