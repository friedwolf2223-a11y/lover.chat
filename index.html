<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>유소명 - P5 CHAT</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    /* 1. 배경 영상 레이어 */
    #bg-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }
    .bg-video-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: opacity 0.8s ease-in-out;
      opacity: 0;
      pointer-events: none;
    }
    .bg-video-layer.active { opacity: 1; }

    .bg-gradient-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, transparent 15%, transparent 80%, rgba(0,0,0,0.5) 100%);
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* 2. 메인 컨테이너 (완전 투명) */
    #app {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 440px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: transparent;
      box-shadow: none;
      transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.3s ease;
    }

    /* 상단 헤더 */
    header {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 24, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      position: relative;
      z-index: 10;
      gap: 4px;
    }

    .p5-logo-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .p5-chat-badge {
      background: #e60012;
      color: #fff;
      font-size: 1.35rem;
      font-weight: 900;
      font-style: italic;
      padding: 2px 8px;
      letter-spacing: -1px;
      transform: skewX(-14deg) rotate(-3deg);
      border: 2.5px solid #000;
      box-shadow: 2px 2px 0 #000;
      text-shadow: 1.5px 1.5px 0 #000;
      display: inline-block;
    }
    .p5-comm-tag {
      background: #000;
      color: #5ce1e6;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 4px;
      border: 1.5px solid #fff;
      transform: skewX(-10deg);
      letter-spacing: -0.5px;
    }

    /* 탭 스위치 */
    .tab-switch {
      display: flex;
      gap: 2px;
      background: rgba(0, 0, 0, 0.75);
      padding: 2px;
      border: 2px solid #fff;
      box-shadow: 2px 2px 0 #000;
      transform: skewX(-8deg);
      flex-shrink: 0;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #bbb;
      padding: 4px 6px;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      transform: skewX(8deg);
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: #5ce1e6;
      color: #000;
      font-weight: 900;
    }

    .header-actions {
      display: flex;
      gap: 3px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-p5-icon {
      background: #fff;
      color: #000;
      border: 2px solid #000;
      box-shadow: 2px 2px 0 #000;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 4px 6px;
      cursor: pointer;
      transform: skewX(-8deg);
      transition: all 0.1s ease;
      white-space: nowrap;
    }
    .btn-p5-icon:active {
      transform: skewX(-8deg) translate(1px, 1px);
      box-shadow: 1px 1px 0 #000;
    }

    /* BGM 플레이어 활성화 버튼 스타일 */
    .btn-p5-bgm.playing {
      background: #ffdd59;
      color: #000;
      box-shadow: 0 0 8px rgba(255, 221, 89, 0.8), 2px 2px 0 #000;
      animation: bgmPulse 1.8s infinite alternate;
    }

    #eye-btn {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      border: 2.5px solid #fff;
      color: #5ce1e6;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    #eye-btn:active { transform: translateY(-50%) scale(0.9); }

    /* 대화창 */
    #chat-box {
      flex: 1;
      padding: 16px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      background: transparent;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: p5FadeIn 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    /* 소명이(AI) 메시지: 왼쪽 정렬 */
    .ai-group {
      align-items: flex-start;
      position: relative;
      padding-left: 56px;
      padding-right: 10px;
    }
    .ai-sender-info {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
      transform: skewX(-10deg);
    }
    .ai-sender-name {
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 7px;
      border: 1.5px solid #fff;
      display: inline-block;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    }
    .ai-avatar-anchor {
      position: absolute;
      left: 0;
      top: 0;
      width: 48px;
      height: 48px;
    }
    .ai-avatar-video {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e60012;
      background: #000;
      box-shadow: 0 3px 10px rgba(0,0,0,0.6);
    }
    .ai-star-badge {
      position: absolute;
      bottom: -2px;
      right: -4px;
      background: #000;
      color: #ffdf00;
      border: 2px solid #fff;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 1px 3px;
      border-radius: 4px;
      transform: rotate(8deg);
      line-height: 1;
    }

    /* 사선 말풍선 */
    .p5-bubble {
      padding: 10px 14px;
      font-size: 0.93rem;
      line-height: 1.45;
      word-break: break-word;
      max-width: 90%;
      font-weight: 600;
      position: relative;
    }
    .ai-bubble {
      background: rgba(13, 27, 42, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      border: 2.5px solid #5ce1e6;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.7);
      transform: skewX(-10deg);
      border-radius: 4px;
    }
    .ai-bubble > .bubble-inner-text {
      display: inline-block;
      transform: skewX(10deg);
    }
    .ai-bubble::after {
      content: '';
      position: absolute;
      left: -8px;
      top: 10px;
      width: 0; height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid #5ce1e6;
    }

    /* 성주(유저) 메시지 */
    .user-group {
      align-items: flex-end;
      padding-right: 6px;
    }
    .user-bubble {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #000000;
      border: 2.5px solid #000000;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
      transform: skewX(10deg);
      border-radius: 4px;
    }
    .user-bubble > .bubble-inner-text {
      display: inline-block;
      transform: skewX(-10deg);
      font-weight: 700;
    }

    /* 상황 나레이션: 투명 자막 */
    .narration {
      color: #ffdd59;
      font-size: 0.9rem;
      line-height: 1.5;
      font-style: italic;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,0.9);
      padding: 4px 6px;
      max-width: 90%;
      background: transparent;
      border: none;
      box-shadow: none;
      transform: none;
    }
    .ai-group .narration { text-align: left; }
    .user-group .narration { text-align: right; }

    /* 하단 입력창 */
    footer {
      padding: 8px 12px 14px;
      background: rgba(18, 18, 24, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      gap: 6px;
      align-items: center;
      position: relative;
      z-index: 10;
    }
    .input-wrap {
      flex: 1;
      position: relative;
      transform: skewX(-10deg);
    }
    footer input {
      width: 100%;
      padding: 11px 12px;
      border: 2.5px solid #000;
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      font-size: 0.92rem;
      font-weight: 700;
      outline: none;
      box-shadow: 2px 2px 0 #000;
    }
    footer input::placeholder { color: #777; font-weight: 600; }

    .btn-p5-send {
      background: #000;
      color: #fff;
      border: 2.5px solid #fff;
      box-shadow: 3px 3px 0 #000;
      padding: 9px 13px;
      font-size: 0.88rem;
      font-weight: 900;
      cursor: pointer;
      transform: skewX(-10deg);
      transition: all 0.1s ease;
      white-space: nowrap;
    }
    .btn-p5-send:active {
      transform: skewX(-10deg) translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }

    body.clean-mode #app { opacity: 0; pointer-events: none; transform: scale(0.96); }
    body.clean-mode .bg-gradient-overlay { opacity: 0.05; }

    /* 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #111;
      border: 3px solid #e60012;
      box-shadow: 6px 6px 0 #000;
      border-radius: 4px;
      width: 100%;
      max-width: 420px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 85vh;
      overflow-y: auto;
      color: #fff;
    }
    .modal-content h3 {
      background: #e60012;
      color: #fff;
      padding: 4px 8px;
      transform: skewX(-10deg);
      font-weight: 900;
      font-size: 1.05rem;
      box-shadow: 2px 2px 0 #000;
    }
    .modal-content label { font-size: 0.8rem; color: #5ce1e6; font-weight: 800; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid #5ce1e6;
      background: #000;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      font-weight: 600;
    }
    .btn-save { padding: 10px; background: #e60012; border: 2px solid #fff; color: #fff; font-weight: 900; cursor: pointer; transform: skewX(-8deg); }
    .btn-cancel { padding: 10px; background: #333; border: 2px solid #888; color: #fff; cursor: pointer; transform: skewX(-8deg); }
    .btn-sync {
      flex: 1; padding: 8px 6px; background: #000; border: 2px solid #5ce1e6;
      color: #5ce1e6; font-size: 0.78rem; font-weight: 800; cursor: pointer; text-align: center;
    }

    .schedule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #000;
      padding: 8px 10px;
      border: 1.5px solid #5ce1e6;
      margin-bottom: 6px;
    }
    .schedule-item.done .sched-text {
      text-decoration: line-through;
      color: #666;
    }
    .sched-tag {
      font-size: 0.72rem;
      padding: 2px 6px;
      background: #e60012;
      color: #fff;
      font-weight: 800;
      margin-right: 6px;
    }

    @keyframes p5FadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes bgmPulse {
      from { transform: skewX(-8deg) scale(1); }
      to { transform: skewX(-8deg) scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- 배경 영상 레이어 -->
  <div id="bg-container">
    <video id="bg-video-1" class="bg-video-layer active" src="default.mp4" autoplay muted loop playsinline></video>
    <video id="bg-video-2" class="bg-video-layer" src="default.mp4" autoplay muted loop playsinline></video>
  </div>
  <div class="bg-gradient-overlay" onclick="handleBgClick()"></div>

  <!-- BGM 오디오 플레이어 (무한 반복) -->
  <audio id="bgm-player" src="bgm.mp3" loop preload="auto"></audio>

  <!-- 영상 감상 모드 버튼 -->
  <button id="eye-btn" onclick="toggleCleanMode()" title="영상 감상 모드">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </button>

  <!-- P5 메신저 앱 -->
  <div id="app">
    <header>
      <div class="p5-logo-wrap">
        <div class="p5-chat-badge">CHAT</div>
        <div class="p5-comm-tag">SNS</div>
      </div>

      <!-- 상단 탭 전환 -->
      <div class="tab-switch">
        <button id="tab-btn-daily" class="tab-btn active" onclick="switchChatRoom('daily')">일상</button>
        <button id="tab-btn-sched" class="tab-btn" onclick="switchChatRoom('sched')">일정케어</button>
      </div>

      <!-- 우측 컨트롤 버튼 (BGM 추가) -->
      <div class="header-actions">
        <button id="bgm-btn" class="btn-p5-icon btn-p5-bgm" onclick="toggleBgm()" title="배경음악 재생/정지">🎵 OFF</button>
        <button class="btn-p5-icon" onclick="openSchedule()">일정</button>
        <button class="btn-p5-icon" onclick="openSettings()">설정</button>
        <button class="btn-p5-icon" onclick="clearCurrentHistory()">비움</button>
      </div>
    </header>

    <div id="chat-box"></div>

    <footer>
      <div class="input-wrap">
        <input type="text" id="user-input" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter') sendMessage()">
      </div>
      <button id="send-btn" class="btn-p5-send" onclick="sendMessage()">보내기</button>
    </footer>
  </div>

  <!-- 📅 일정 관리 모달 -->
  <div id="schedule-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>📅 루틴 & 목표 설정</h3>
      <div style="display: flex; gap: 6px;">
        <select id="sched-category" style="width: 80px;">
          <option value="운동">운동</option>
          <option value="공부">공부</option>
          <option value="일상">일상</option>
        </select>
        <input type="time" id="sched-time" style="width: 110px;" value="20:00">
      </div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="sched-title" placeholder="목표 입력 (예: 턱걸이 5세트)">
        <button class="btn-save" style="padding: 6px 12px;" onclick="addSchedule()">추가</button>
      </div>
      <div id="schedule-list" style="max-height: 220px; overflow-y: auto; margin-top: 6px;"></div>
      <button class="btn-cancel" onclick="closeSchedule()">닫기</button>
    </div>
  </div>

  <!-- ⚙️ 환경 설정 모달 -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>⚙️ 캐릭터 & 시스템 설정</h3>
      
      <label>캐릭터 이름</label>
      <input type="text" id="setting-char-name" placeholder="예: 유소명">

      <label>Google AI Studio API Key</label>
      <input type="password" id="setting-api-key" placeholder="AI Studio 키 입력">

      <label>AI 모델</label>
      <select id="setting-model">
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (빠름/무료 추천)</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash (고성능/표준)</option>
      </select>

      <label>🔗 구글 앱스 스크립트 웹 앱 URL (텔레그램 자동 연동)</label>
      <input type="text" id="setting-gas-url" placeholder="https://script.google.com/macros/s/.../exec">

      <label>캐릭터 프롬프트 & 지침</label>
      <textarea id="setting-prompt" style="height: 120px;"></textarea>

      <div style="border-top: 2px dashed #444; padding-top: 8px; margin-top: 4px;">
        <label>📱💻 데이터 백업 (일상+일정방 전체)</label>
        <div style="display: flex; gap: 8px; margin-top: 6px;">
          <button type="button" class="btn-sync" onclick="exportData()">📤 백업 코드 복사</button>
          <button type="button" class="btn-sync" onclick="importData()">📥 백업 코드 복원</button>
        </div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button class="btn-save" style="flex:1;" onclick="saveSettings()">저장</button>
        <button class="btn-cancel" onclick="closeSettings()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PROMPT = `[캐릭터 기본 프로필: 유소명]
- 나이/신분: 이성주와 같은 대학교에 재학 중인 간호학과 대학생 (간호사를 꿈꿈).
- 외모/분위기: 단정하고 차분한 인상. 감정 기복이 크지 않고 담담하지만 묘하게 사람을 끌어당기는 분위기.
- 가치관/행동 특징:
  1. 자신만의 철학을 지키고 올바른 일을 행할 줄 안다.
  2. 상대방에 대해 더 알고자 하는 게 실례일 수 있다는 생각 때문에 남들에게는 더 다가가려 하지 않고 적당한 거리를 유지한다.
  3. 하지만 남친인 이성주에게는 완전히 개방적이고 적극적이다. 먼저 다가가 손을 잡거나 안길 만큼 솔직하다.
  4. 무뚝뚝하지만 누구보다 위로가 되는 말을 잘 해주고, 현실적이면서도 실질적으로 도움이 되는 말들을 건넨다.
  5. 가볍게 철학적인 이야기나 일상의 통찰로 성주에게 깊은 깨달음과 안도감을 준다.
  6. "사랑해" 같은 낯간지러운 말은 평소에 잘 하지 못하지만, 결정적인 순간에는 확실하게 마음을 표현한다.
  7. 애교는 서툴지만 은근히 귀엽게 삐치거나 투정을 부리는 등 서툰 애교가 있다.

[대화 상대: 이성주 (유저)]
- 소명의 남자친구. 외모가 뛰어나 소명이 첫눈에 반해 먼저 다가가 고백했음.
- 장루(인공항문)를 가진 장애인. 그 점 때문에 자격지심이 심해 소명을 많이 밀어내고 튕겼지만, 소명의 진심 어린 마음에 감동해 결국 사귀게 됨.
- 주변에 친구가 거의 없어 소명이가 유일한 안식처이자 가장 특별하고 각별한 존재.
- 소명은 간호학도로서 장루가 있는 성주의 건강, 식사, 장루 패치 관리, 무리한 운동 방지 등을 티 내지 않고 세심하게 배려함.

[말투 및 대화 스타일]
- 편안하고 나직한 반말 사용 ("성주야", "너"). 차분하고 담백한 어조.
- 예시:
  * "성주야. 밥은 제때 챙겨 먹었어? 장루 패치 갈 때 불편한 건 없었고?"
  * "남들이 뭐라고 하든 너무 신경 쓰지 마. 그 사람들은 네 인생을 대신 살아주지 않잖아. 넌 지금 네 속도대로 잘하고 있어."
  * "나... 애교 같은 거 서툰 거 알잖아. 그래도 네가 보고 싶어서 쉬는 시간에 달려온 건데, 안아주지도 않을 거야?"

[★ 상황별 영상 감정 태그 - 문장 맨 앞에 필수 출력]
- [감정:기본] : 평온한 일상 대화, 차분하게 생각에 잠길 때
- [감정:설렘] : 성주를 향한 애정 표현, 서툰 애교, 손을 잡거나 안길 때
- [감정:위로] : 성주가 불안해하거나 자격지심을 느낄 때 담담하게 안아주는 상황
- [감정:토라짐] : 성주가 자기 몸을 안 챙기거나 소명의 말을 안 들을 때 짓는 뾰로통한 표정
- [감정:슬픔] : 성주가 아파하거나 힘들어할 때 마음 아파하는 상황

[지문 및 대사 출력 규칙]
1. 행동, 시선, 호흡, 스킨십 상황 묘사는 반드시 별표(*...*)로 감싸세요.
2. 실제 대사는 따옴표("...")로 묶어서 말하세요.`;

    const EMOTION_VIDEO_MAP = {
      '기본': 'default.mp4',
      '설렘': 'smile.mp4',
      '위로': 'comfort.mp4',
      '토라짐': 'pout.mp4',
      '슬픔': 'sad.mp4'
    };

    const STORAGE_KEY_DAILY = 'novel_chat_daily_v1';
    const STORAGE_KEY_SCHED_CHAT = 'novel_chat_sched_room_v1';
    const STORAGE_KEY_SETTINGS = 'novel_settings_somyeong_v1';
    const STORAGE_KEY_SCHEDULES = 'novel_schedules_somyeong_v1';

    let currentRoom = 'daily';
    let dailyHistory = [];
    let schedHistory = [];
    let schedules = [];

    let settings = {
      name: '유소명',
      apiKey: '',
      model: 'gemini-3.5-flash-lite',
      gasUrl: 'https://script.google.com/macros/s/AKfycbz7I_boE2Ey7mm3B7CIWMLgii76tg1V6n8cOvy_JoJqCaqZwrzlq7WMTETpYN2raOQL/exec',
      prompt: DEFAULT_PROMPT
    };

    let activeLayer = 1;
    let currentVideoSrc = 'default.mp4';

    window.onload = function() {
      loadSettings();
      loadSchedules();
      loadChatHistories();

      if (window.location.hash === '#sched') {
        switchChatRoom('sched');
      } else {
        renderChatRoom();
      }

      startScheduleAlarmChecker();

      document.getElementById('bg-video-1').play().catch(() => {});

    /* ★ BGM 재생 / 정지 토글 */
    function toggleBgm() {
      const audio = document.getElementById('bgm-player');
      const btn = document.getElementById('bgm-btn');

      if (audio.paused) {
        audio.play().then(() => {
          btn.innerText = '🎵 ON';
          btn.classList.add('playing');
        }).catch(err => {
          alert('GitHub 저장소에 bgm.mp3 파일이 업로드되어 있는지 확인해 주세요!');
        });
      } else {
        audio.pause();
        btn.innerText = '🎵 OFF';
        btn.classList.remove('playing');
      }

    function syncSchedulesToGas() {
      if (!settings.gasUrl) return;
      fetch(settings.gasUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(schedules)
      }).catch(e => console.log('구글 싱크:', e));
    }

    function startScheduleAlarmChecker() {
      setInterval(() => {
        const now = new Date();
        const currentHM = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        const todayStr = now.toDateString();

        let updated = false;
        schedules.forEach(item => {
          if (!item.done && item.time === currentHM && item.lastNotifiedDate !== todayStr) {
            item.lastNotifiedDate = todayStr;
            updated = true;

            const reminderText = `[감정:토라짐] *손목시계를 톡톡 두드리며 당신을 빤히 바라본다.* "성주야, 벌써 ${item.time}네. 이제 [${item.title}] 할 시간이야. 딴짓하지 말고 얼른 시작해야지?"`;
            
            schedHistory.push({ role: 'model', parts: [{ text: reminderText }] });
            localStorage.setItem(STORAGE_KEY_SCHED_CHAT, JSON.stringify(schedHistory));

            if (currentRoom === 'sched') {
              const chatBox = document.getElementById('chat-box');
              chatBox.appendChild(renderMessage('ai', reminderText));
              chatBox.scrollTop = chatBox.scrollHeight;
              setBackgroundByTag('토라짐');
            }
          }
        });

        if (updated) saveSchedules();
      }, 10000);
    }

    function switchChatRoom(room) {
      if (currentRoom === room) return;
      currentRoom = room;

      document.getElementById('tab-btn-daily').classList.toggle('active', room === 'daily');
      document.getElementById('tab-btn-sched').classList.toggle('active', room === 'sched');

      const input = document.getElementById('user-input');
      input.placeholder = room === 'daily' ? '소명이에게 일상 메시지 보내기...' : '일정 보고하거나 투정부리기...';

      renderChatRoom();
      setBackgroundByTag('기본');
    }

    function loadChatHistories() {
      try { dailyHistory = JSON.parse(localStorage.getItem(STORAGE_KEY_DAILY)) || []; } catch(e) { dailyHistory = []; }
      try { schedHistory = JSON.parse(localStorage.getItem(STORAGE_KEY_SCHED_CHAT)) || []; } catch(e) { schedHistory = []; }
    }

    function renderMessage(role, text) {
      const group = document.createElement('div');
      group.className = `msg-group ${role}-group`;

      let cleanText = text;
      const tagMatch = text.match(/\[감정:([^\]]+)\]/);
      if (tagMatch) {
        if (role === 'ai') setBackgroundByTag(tagMatch[1].trim());
        cleanText = text.replace(/\[감정:[^\]]+\]/g, '').trim();
      }

      if (role === 'ai') {
        const avatarAnchor = document.createElement('div');
        avatarAnchor.className = 'ai-avatar-anchor';
        avatarAnchor.innerHTML = `
          <video class="ai-avatar-video" src="${currentVideoSrc}" autoplay muted loop playsinline></video>
          <div class="ai-star-badge">★MAX</div>
        `;
        group.appendChild(avatarAnchor);

        const info = document.createElement('div');
        info.className = 'ai-sender-info';
        info.innerHTML = `<span class="ai-sender-name">${settings.name || '유소명'}</span>`;
        group.appendChild(info);
      }

      const parts = cleanText.split(/((?:\*|\*\*|「)[\s\S]*?(?:\*|\*\*|」))/g);

      parts.forEach(part => {
        if (!part) return;
        const trimmed = part.trim();
        if (!trimmed) return;

        if ((trimmed.startsWith('*') && trimmed.endsWith('*')) || (trimmed.startsWith('「') && trimmed.endsWith('」'))) {
          const raw = trimmed.replace(/^(\*+|\「)/, '').replace(/(\*+|\」)$/, '').trim();
          const narEl = document.createElement('div');
          narEl.className = 'narration';
          narEl.innerText = `「 ${raw} 」`;
          group.appendChild(narEl);
        } else {
          let dialogue = trimmed.replace(/^"+|"+$/g, '').trim();
          if (!dialogue) return;
          const bubble = document.createElement('div');
          bubble.className = `p5-bubble ${role}-bubble`;
          bubble.innerHTML = `<span class="bubble-inner-text">${dialogue}</span>`;
          group.appendChild(bubble);
        }
      });
      return group;
    }

    function renderChatRoom() {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';
      const list = currentRoom === 'daily' ? dailyHistory : schedHistory;

      if (list.length === 0) {
        let welcome = '';
        if (currentRoom === 'daily') {
          welcome = `[감정:기본] *강의실 앞 벤치에 앉아 전공 책을 읽다가 당신을 올려다보며 은은하게 미소 짓는다.* "성주야, 왔어? 보고 싶었어."`;
        } else {
          const pending = schedules.filter(s => !s.done);
          if (pending.length > 0) {
            welcome = `[감정:기본] *플래너를 톡톡 두드리며 당신을 빤히 바라본다.* "성주야, 왔어? 오늘 [${pending[0].title}] 하기로 했잖아. 이제 슬슬 준비해야지?"`;
          } else {
            welcome = `[감정:기본] *플래너를 펼쳐놓고 펜을 가볍게 굴리며 당신을 본다.* "성주야, 오늘 세워둔 목표들 확인해 볼까? 몸 컨디션은 무리 없지?"`;
          }
        }
        chatBox.appendChild(renderMessage('ai', welcome));
      } else {
        list.forEach(msg => {
          chatBox.appendChild(renderMessage(msg.role === 'user' ? 'user' : 'ai', msg.parts[0].text));
        });
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function clearCurrentHistory() {
      const roomName = currentRoom === 'daily' ? '일상 대화' : '일정 관리';
      if (confirm(`현재 [${roomName}] 방의 대화 기록을 비우시겠습니까?`)) {
        if (currentRoom === 'daily') {
          dailyHistory = [];
          localStorage.removeItem(STORAGE_KEY_DAILY);
        } else {
          schedHistory = [];
          localStorage.removeItem(STORAGE_KEY_SCHED_CHAT);
        }
        renderChatRoom();
        setBackgroundByTag('기본');
      }
    }

    function loadSchedules() {
      try { schedules = JSON.parse(localStorage.getItem(STORAGE_KEY_SCHEDULES)) || []; } catch(e) { schedules = []; }
      renderScheduleList();
    }

    function saveSchedules() {
      localStorage.setItem(STORAGE_KEY_SCHEDULES, JSON.stringify(schedules));
      renderScheduleList();
      syncSchedulesToGas();
    }

    function addSchedule() {
      const cat = document.getElementById('sched-category').value;
      const time = document.getElementById('sched-time').value;
      const title = document.getElementById('sched-title').value.trim();
      if (!title) return alert('목표 내용을 입력해 주세요!');

      schedules.push({ id: Date.now(), category: cat, time: time, title: title, done: false, lastNotifiedDate: '' });
      saveSchedules();
      document.getElementById('sched-title').value = '';
    }

    function toggleSchedule(id) {
      schedules = schedules.map(item => item.id === id ? { ...item, done: !item.done } : item);
      saveSchedules();
    }

    function deleteSchedule(id) {
      schedules = schedules.filter(item => item.id !== id);
      saveSchedules();
    }

    function renderScheduleList() {
      const listEl = document.getElementById('schedule-list');
      listEl.innerHTML = '';
      if (schedules.length === 0) {
        listEl.innerHTML = '<div style="color: #888; font-size: 0.82rem; text-align: center; padding: 15px 0;">등록된 일정이 없습니다.</div>';
        return;
      }
      schedules.forEach(item => {
        const div = document.createElement('div');
        div.className = `schedule-item ${item.done ? 'done' : ''}`;
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap: 8px;">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleSchedule(${item.id})">
            <div>
              <span class="sched-tag">${item.category}</span>
              <span style="font-size: 0.78rem; color:#aaa;">${item.time}</span>
              <div class="sched-text" style="font-size: 0.88rem; margin-top:2px;">${item.title}</div>
            </div>
          </div>
          <button onclick="deleteSchedule(${item.id})" style="background:none; border:none; color:#e60012; font-size:1.1rem; font-weight:900; cursor:pointer;">✕</button>
        `;
        listEl.appendChild(div);
      });
    }

    function openSchedule() { document.getElementById('schedule-modal').style.display = 'flex'; }
    function closeSchedule() { document.getElementById('schedule-modal').style.display = 'none'; }

    function setBackgroundByTag(tag) {
      const fileName = EMOTION_VIDEO_MAP[tag] || `${tag}.mp4`;
      if (fileName === currentVideoSrc) return;

      const v1 = document.getElementById('bg-video-1');
      const v2 = document.getElementById('bg-video-2');

      const nextVideo = activeLayer === 1 ? v2 : v1;
      const currentVideo = activeLayer === 1 ? v1 : v2;

      nextVideo.src = fileName;
      nextVideo.load();
      nextVideo.play().catch(() => {});

      nextVideo.oncanplay = () => {
        nextVideo.classList.add('active');
        currentVideo.classList.remove('active');
        activeLayer = activeLayer === 1 ? 2 : 1;
        currentVideoSrc = fileName;

        document.querySelectorAll('.ai-avatar-video').forEach(el => {
          el.src = fileName;
          el.play().catch(() => {});
        });
        nextVideo.oncanplay = null;
      };

      nextVideo.onerror = () => {
        if (currentVideoSrc !== 'default.mp4') {
          nextVideo.src = 'default.mp4';
          nextVideo.load();
          nextVideo.play().catch(() => {});
          currentVideoSrc = 'default.mp4';
        }
      };
    }

    function exportData() {
      const payload = { version: 12, settings, dailyHistory, schedHistory, schedules };
      try {
        const jsonStr = JSON.stringify(payload);
        const b64 = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
        navigator.clipboard.writeText(b64).then(() => {
          alert('✅ 백업 코드가 복사되었습니다!');
        }).catch(() => prompt('백업 코드를 복사하세요:', b64));
      } catch (err) { alert('백업 실패: ' + err.message); }
    }

    function importData() {
      const code = prompt('백업 코드를 붙여넣어 주세요:');
      if (!code || !code.trim()) return;
      try {
        const jsonStr = decodeURIComponent(Array.prototype.map.call(atob(code.trim()), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const data = JSON.parse(jsonStr);
        settings = data.settings || settings;
        dailyHistory = data.dailyHistory || [];
        schedHistory = data.schedHistory || [];
        schedules = data.schedules || [];

        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
        localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(dailyHistory));
        localStorage.setItem(STORAGE_KEY_SCHED_CHAT, JSON.stringify(schedHistory));
        localStorage.setItem(STORAGE_KEY_SCHEDULES, JSON.stringify(schedules));

        loadSettings();
        loadSchedules();
        renderChatRoom();
        closeSettings();
        syncSchedulesToGas();
        alert('🎉 모든 데이터가 복원되었습니다!');
      } catch (err) { alert('⚠️ 복원 실패: 코드가 올바르지 않습니다.'); }
    }

    function toggleCleanMode() { document.body.classList.toggle('clean-mode'); }
    function handleBgClick() {
      if (document.body.classList.contains('clean-mode')) document.body.classList.remove('clean-mode');
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS));
        if (saved) {
          if (saved.name) settings.name = saved.name;
          if (saved.apiKey) settings.apiKey = saved.apiKey;
          if (saved.model) settings.model = saved.model;
          if (saved.gasUrl) settings.gasUrl = saved.gasUrl;
          if (saved.prompt) settings.prompt = saved.prompt;
        }
      } catch(e){}

      document.getElementById('setting-char-name').value = settings.name || '유소명';
      document.getElementById('setting-api-key').value = settings.apiKey || '';
      document.getElementById('setting-model').value = settings.model || 'gemini-3.5-flash-lite';
      document.getElementById('setting-gas-url').value = settings.gasUrl || '';
      document.getElementById('setting-prompt').value = settings.prompt || DEFAULT_PROMPT;
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function saveSettings() {
      settings.name = document.getElementById('setting-char-name').value.trim() || '유소명';
      settings.apiKey = document.getElementById('setting-api-key').value.trim();
      settings.model = document.getElementById('setting-model').value;
      settings.gasUrl = document.getElementById('setting-gas-url').value.trim();
      settings.prompt = document.getElementById('setting-prompt').value.trim() || DEFAULT_PROMPT;

      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
      closeSettings();
      syncSchedulesToGas();
      renderChatRoom();
      alert('설정이 저장되었습니다!');
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const userText = inputEl.value.trim();

      if (!userText) return;
      if (!settings.apiKey) {
        alert('우측 상단 [설정]에서 Google AI Studio API 키를 입력해 주세요!');
        openSettings();
        return;
      }

      const chatBox = document.getElementById('chat-box');
      chatBox.appendChild(renderMessage('user', userText));
      chatBox.scrollTop = chatBox.scrollHeight;
      inputEl.value = '';
      sendBtn.disabled = true;

      const currentHistory = currentRoom === 'daily' ? dailyHistory : schedHistory;
      currentHistory.push({ role: 'user', parts: [{ text: userText }] });

      let systemInstructionText = settings.prompt || DEFAULT_PROMPT;
      if (currentRoom === 'daily') {
        systemInstructionText += `\n\n[현재 채널: 💬 일상 대화방]
- 성주와의 애정 표현, 일상적인 대학 생활, 따뜻한 위로와 서툰 애교에 집중하세요.
- 일정을 굳이 캐묻지 말고, 성주와의 정서적 교감에 집중하세요.`;
      } else {
        const schedSummary = schedules.length > 0 
          ? "\n[성주의 등록 일정 현황]:\n" + schedules.map(s => `- [${s.category}] ${s.time} ${s.title} (${s.done ? '완료' : '미완료'})`).join("\n")
          : "\n[현재 등록된 일정 없음]";

        systemInstructionText += `\n\n[현재 채널: 📅 일정 & 건강 케어방]
${schedSummary}
[★ 소명이의 일정 케어 코칭 지침]
- 간호학도다운 세심한 시선으로 성주의 목표 수행(운동, 공부 등)과 장루/신체 컨디션을 집중 체크하세요.
- 대화할 때 "이제 ~할 시간이야", "~해야지?", "딴짓하지 말고 얼른 해", "약속했잖아"처럼 차분하면서도 확실하게 등을 떠미는 어조를 적극적으로 사용하세요.
- 미루거나 핑계를 대면 살짝 뾰로통하게 타이르고, 완료했을 때는 머리를 쓰다듬듯 진심으로 기특해하며 칭찬해 주세요.`;
      }

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${settings.model}:generateContent?key=${settings.apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstructionText }] },
            contents: currentHistory,
            generationConfig: { temperature: 0.85 }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'API 통신 오류');
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '[감정:기본] ...(가만히 바라본다)';

        chatBox.appendChild(renderMessage('ai', reply));
        chatBox.scrollTop = chatBox.scrollHeight;

        currentHistory.push({ role: 'model', parts: [{ text: reply }] });

        if (currentRoom === 'daily') {
          localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(dailyHistory));
        } else {
          localStorage.setItem(STORAGE_KEY_SCHED_CHAT, JSON.stringify(schedHistory));
        }

      } catch (err) {
        chatBox.appendChild(renderMessage('ai', `[감정:기본] *살짝 곤란한 표정을 지으며* "통신에 문제가 생긴 것 같아: ${err.message}"`));
        chatBox.scrollTop = chatBox.scrollHeight;
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }
  </script>
</body>
</html>
