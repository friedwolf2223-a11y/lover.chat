<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>유소명 - P5X CHAT</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    /* 1. 배경 영상 레이어 */
    #bg-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }
    .bg-video-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: opacity 0.8s ease-in-out;
      opacity: 0;
      pointer-events: none;
    }
    .bg-video-layer.active { opacity: 1; }

    .bg-gradient-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, transparent 15%, transparent 80%, rgba(0,0,0,0.5) 100%);
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* 2. 메인 컨테이너 */
    #app {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 440px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: transparent;
      box-shadow: none;
      transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.3s ease;
    }

    /* 3. 상단 헤더: 모바일 최적화 정돈 */
    header {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 24, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      position: relative;
      z-index: 10;
      gap: 6px;
    }

    .p5-logo-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .p5-chat-badge {
      background: #e60012;
      color: #fff;
      font-size: 1.35rem;
      font-weight: 900;
      font-style: italic;
      padding: 2px 8px;
      letter-spacing: -1px;
      transform: skewX(-14deg) rotate(-3deg);
      border: 2.5px solid #000;
      box-shadow: 2px 2px 0 #000;
      text-shadow: 1.5px 1.5px 0 #000;
      display: inline-block;
    }
    .p5-comm-tag {
      background: #000;
      color: #5ce1e6;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 4px;
      border: 1.5px solid #fff;
      transform: skewX(-10deg);
      letter-spacing: -0.5px;
    }

    /* 상단 탭 스위치 */
    .tab-switch {
      display: flex;
      gap: 2px;
      background: rgba(0, 0, 0, 0.85);
      padding: 2px;
      border: 2px solid #fff;
      box-shadow: 2px 2px 0 #000;
      transform: skewX(-8deg);
      flex-shrink: 0;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #bbb;
      padding: 4px 7px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      transform: skewX(8deg);
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: #5ce1e6;
      color: #000;
      font-weight: 900;
    }

    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-p5-icon {
      background: #fff;
      color: #000;
      border: 2px solid #000;
      box-shadow: 2px 2px 0 #000;
      font-size: 0.74rem;
      font-weight: 900;
      padding: 4px 7px;
      cursor: pointer;
      transform: skewX(-8deg);
      transition: all 0.1s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-p5-icon:active {
      transform: skewX(-8deg) translate(1px, 1px);
      box-shadow: 1px 1px 0 #000;
    }

    /* P5X BGM 헤더 버튼 */
    .btn-p5-music-badge {
      background: #111;
      color: #5ce1e6;
      border: 2px solid #5ce1e6;
    }
    .btn-p5-music-badge.playing {
      background: #e60012;
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 8px rgba(230, 0, 18, 0.8), 2px 2px 0 #000;
      animation: bgmPulse 1.8s infinite alternate;
    }

    /* ★ P5X 메뉴 토글 버튼 ★ */
    .btn-p5-menu-trigger {
      background: #e60012;
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 2.5px 2.5px 0 #000;
      font-size: 0.76rem;
      letter-spacing: -0.3px;
    }

    #eye-btn {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      border: 2.5px solid #fff;
      color: #5ce1e6;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    #eye-btn:active { transform: translateY(-50%) scale(0.9); }

    /* 대화창 */
    #chat-box {
      flex: 1;
      padding: 16px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      background: transparent;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: p5FadeIn 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    /* 소명이(AI) 메시지 */
    .ai-group {
      align-items: flex-start;
      position: relative;
      padding-left: 56px;
      padding-right: 10px;
    }
    .ai-sender-info {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
      transform: skewX(-10deg);
    }
    .ai-sender-name {
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 7px;
      border: 1.5px solid #fff;
      display: inline-block;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    }
    .ai-avatar-anchor {
      position: absolute;
      left: 0;
      top: 0;
      width: 48px;
      height: 48px;
    }
    .ai-avatar-video {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e60012;
      background: #000;
      box-shadow: 0 3px 10px rgba(0,0,0,0.6);
    }
    .ai-star-badge {
      position: absolute;
      bottom: -2px;
      right: -4px;
      background: #000;
      color: #ffdf00;
      border: 2px solid #fff;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 1px 3px;
      border-radius: 4px;
      transform: rotate(8deg);
      line-height: 1;
    }

    /* 사선 말풍선 */
    .p5-bubble {
      padding: 10px 14px;
      font-size: 0.93rem;
      line-height: 1.45;
      word-break: break-word;
      max-width: 90%;
      font-weight: 600;
      position: relative;
      animation: bubblePop 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .ai-bubble {
      background: rgba(13, 27, 42, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      border: 2.5px solid #5ce1e6;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.7);
      transform: skewX(-10deg);
      border-radius: 4px;
    }
    .ai-bubble > .bubble-inner-text {
      display: inline-block;
      transform: skewX(10deg);
    }
    .ai-bubble::after {
      content: '';
      position: absolute;
      left: -8px;
      top: 10px;
      width: 0; height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid #5ce1e6;
    }

    .user-group {
      align-items: flex-end;
      padding-right: 6px;
    }
    .user-bubble {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #000000;
      border: 2.5px solid #000000;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
      transform: skewX(10deg);
      border-radius: 4px;
    }
    .user-bubble > .bubble-inner-text {
      display: inline-block;
      transform: skewX(-10deg);
      font-weight: 700;
    }

    /* 상황 나레이션: 띄어쓰기/공백 보존 */
    .narration {
      color: #ffdd59;
      font-size: 0.9rem;
      line-height: 1.5;
      font-style: italic;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,0.9);
      padding: 4px 6px;
      max-width: 90%;
      background: transparent;
      border: none;
      box-shadow: none;
      transform: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ai-group .narration { text-align: left; }
    .user-group .narration { text-align: right; }

    footer {
      padding: 8px 12px 14px;
      background: rgba(18, 18, 24, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      gap: 6px;
      align-items: center;
      position: relative;
      z-index: 10;
    }
    .input-wrap {
      flex: 1;
      position: relative;
      transform: skewX(-10deg);
    }
    footer input {
      width: 100%;
      padding: 11px 12px;
      border: 2.5px solid #000;
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      font-size: 0.92rem;
      font-weight: 700;
      outline: none;
      box-shadow: 2px 2px 0 #000;
    }
    footer input::placeholder { color: #777; font-weight: 600; }

    .btn-p5-send {
      background: #000;
      color: #fff;
      border: 2.5px solid #fff;
      box-shadow: 3px 3px 0 #000;
      padding: 9px 13px;
      font-size: 0.88rem;
      font-weight: 900;
      cursor: pointer;
      transform: skewX(-10deg);
      transition: all 0.1s ease;
      white-space: nowrap;
    }
    .btn-p5-send:active {
      transform: skewX(-10deg) translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }

    body.clean-mode #app { opacity: 0; pointer-events: none; transform: scale(0.96); }
    body.clean-mode .bg-gradient-overlay { opacity: 0.05; }

    /* ========================================================
       ★ P5X 스마트폰 메뉴 오버레이 (사진 테마 100% 구현) ★
    ======================================================== */
    #p5x-menu-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 150;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .p5x-phone-body {
      width: 100%;
      max-width: 390px;
      background: #0077c8;
      background-image: radial-gradient(circle at 80% 20%, #0099ff 10%, #0055a5 60%, #002244 100%);
      border: 4px solid #fff;
      box-shadow: 0 0 25px rgba(0,0,0,0.8), 8px 8px 0 #000, inset 0 0 0 3px #000;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      animation: phoneSlideUp 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .p5x-phone-body::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 220px; height: 220px;
      border: 4px dashed rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      pointer-events: none;
    }

    /* 스마트폰 상단 상태바 */
    .p5x-phone-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px 6px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 2px solid rgba(255, 255, 255, 0.25);
    }
    .p5x-phone-time-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 900;
      font-family: monospace;
      color: #fff;
    }
    .btn-p5x-phone-close {
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 2px 2px 0 #000;
      width: 30px; height: 30px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      transform: skewX(-10deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-p5x-phone-close:active {
      transform: skewX(-10deg) translate(1px, 1px);
    }

    /* P5X 캐릭터 영웅 카드 (프로필) */
    .p5x-hero-card {
      margin: 12px 14px 10px;
      background: #000;
      border: 3px solid #fff;
      box-shadow: 4px 4px 0 #000;
      padding: 10px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: skewX(-6deg);
    }
    .p5x-star-badge {
      position: relative;
      width: 60px; height: 60px;
      flex-shrink: 0;
    }
    .p5x-star-avatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ff3344;
      background: #222;
      box-shadow: 0 0 10px rgba(255, 51, 68, 0.7);
    }
    .p5x-star-tag {
      position: absolute;
      bottom: -4px; right: -6px;
      background: #ffdd59;
      color: #000;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 1px 4px;
      border: 1.5px solid #000;
      border-radius: 3px;
      transform: rotate(10deg);
    }
    .p5x-hero-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transform: skewX(6deg);
    }
    .p5x-hero-name {
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
      text-shadow: 2px 2px 0 #000;
    }
    .p5x-hero-level {
      font-size: 0.76rem;
      font-weight: 900;
      color: #5ce1e6;
    }
    .p5x-exp-bar-wrap {
      width: 100%;
      height: 7px;
      background: #333;
      border: 1px solid #fff;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }
    .p5x-exp-bar-fill {
      width: 78%;
      height: 100%;
      background: linear-gradient(90deg, #5ce1e6, #ffdd59);
    }

    /* P5X 앱 아이콘 그리드 */
    .p5x-apps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 6px;
      padding: 12px 14px 20px;
    }
    .p5x-app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: #fff;
      position: relative;
      transition: transform 0.12s ease;
    }
    .p5x-app-item:active {
      transform: scale(0.92);
    }
    .p5x-icon-box {
      width: 54px; height: 54px;
      background: #000;
      border: 3px solid #fff;
      box-shadow: 3px 3px 0 #000;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform: skewX(-8deg);
      transition: all 0.15s ease;
    }
    .p5x-app-item:hover .p5x-icon-box {
      border-color: #5ce1e6;
      box-shadow: 0 0 12px #5ce1e6, 3px 3px 0 #000;
    }
    .p5x-icon-box svg {
      width: 28px; height: 28px;
      fill: #fff;
      transform: skewX(8deg);
    }
    .p5x-app-label {
      font-size: 0.74rem;
      font-weight: 900;
      background: #000;
      color: #fff;
      padding: 1px 6px;
      border: 1.5px solid #fff;
      border-radius: 4px;
      box-shadow: 2px 2px 0 #000;
      transform: skewX(-6deg);
      letter-spacing: -0.3px;
    }
    .p5x-badge-new {
      position: absolute;
      top: -6px; right: -6px;
      background: #ffdd59;
      color: #000;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 1px 4px;
      border: 1.5px solid #000;
      border-radius: 3px;
      transform: rotate(12deg);
      box-shadow: 1px 1px 0 #000;
    }

    /* 일반 모달 스타일 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #0d0d14;
      border: 3px solid #e60012;
      box-shadow: 6px 6px 0 #000;
      border-radius: 4px;
      width: 100%;
      max-width: 420px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 85vh;
      overflow-y: auto;
      color: #fff;
    }
    .modal-content h3 {
      background: #e60012;
      color: #fff;
      padding: 4px 8px;
      transform: skewX(-10deg);
      font-weight: 900;
      font-size: 1.05rem;
      box-shadow: 2px 2px 0 #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-content label { font-size: 0.8rem; color: #5ce1e6; font-weight: 800; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid #5ce1e6;
      background: #000;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      font-weight: 600;
    }
    .btn-save { padding: 10px; background: #e60012; border: 2px solid #fff; color: #fff; font-weight: 900; cursor: pointer; transform: skewX(-8deg); }
    .btn-cancel { padding: 10px; background: #222; border: 2px solid #666; color: #fff; cursor: pointer; transform: skewX(-8deg); }
    .btn-sync {
      flex: 1; padding: 8px 6px; background: #000; border: 2px solid #5ce1e6;
      color: #5ce1e6; font-size: 0.78rem; font-weight: 800; cursor: pointer; text-align: center;
    }

    /* P5X 뮤직 플레이어 모달 디자인 */
    .p5x-player-card {
      background: #14141e;
      border: 2.5px solid #5ce1e6;
      box-shadow: 4px 4px 0 #000, inset 0 0 15px rgba(0,0,0,0.9);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .p5x-tape-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid rgba(92, 225, 230, 0.3);
      padding-bottom: 6px;
    }
    .p5x-tape-tag {
      background: #e60012;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 900;
      padding: 2px 6px;
      transform: skewX(-12deg);
      letter-spacing: -0.5px;
    }
    .track-title-display {
      font-size: 1rem;
      font-weight: 900;
      color: #ffdd59;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 8px rgba(255, 221, 89, 0.4);
      padding: 2px 0;
    }

    .seek-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .seek-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 7px;
      background: #222;
      outline: none;
      border: 1px solid #444;
      box-shadow: inset 0 0 4px #000;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 18px;
      background: #5ce1e6;
      border: 2px solid #000;
      transform: skewX(-14deg);
      cursor: pointer;
      box-shadow: 0 0 8px #5ce1e6;
    }
    .time-text {
      font-size: 0.74rem;
      color: #5ce1e6;
      font-family: monospace;
      font-weight: 700;
      width: 36px;
      text-align: center;
    }

    .p5x-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }
    .btn-p5x-ctrl {
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 2.5px 2.5px 0 #000;
      cursor: pointer;
      transform: skewX(-10deg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .btn-p5x-ctrl:active {
      transform: skewX(-10deg) translate(1.5px, 1.5px);
      box-shadow: 1px 1px 0 #000;
    }
    .btn-p5x-play {
      background: #e60012;
      border: 2px solid #fff;
      width: 44px; height: 38px;
    }
    .btn-p5x-play svg {
      width: 18px; height: 18px;
      fill: #fff;
    }
    .btn-p5x-skip {
      width: 36px; height: 32px;
      border-color: #5ce1e6;
    }
    .btn-p5x-skip svg {
      width: 15px; height: 15px;
      fill: #5ce1e6;
    }

    .btn-p5x-mode {
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 5px;
      border-color: #ffdd59;
      color: #ffdd59;
    }
    .btn-p5x-mode svg {
      width: 14px; height: 14px;
      fill: currentColor;
    }
    .btn-p5x-mode.mode-one {
      border-color: #5ce1e6;
      color: #5ce1e6;
    }
    .btn-p5x-mode.mode-none {
      border-color: #aaa;
      color: #aaa;
    }

    .playlist-box {
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }
    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      background: #000;
      border: 1.5px solid #333;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      transform: skewX(-6deg);
      transition: all 0.15s ease;

    .playlist-item.active {
      border-color: #5ce1e6;
      background: #0c1a29;
      color: #5ce1e6;
      box-shadow: 2px 2px 0 #5ce1e6;
    }

    .schedule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #000;
      padding: 8px 10px;
      border: 1.5px solid #5ce1e6;
      margin-bottom: 6px;
    }
    .schedule-item.done .sched-text {
      text-decoration: line-through;
      color: #666;
    }
    .sched-tag {
      font-size: 0.72rem;
      padding: 2px 6px;
      background: #e60012;
      color: #fff;
      font-weight: 800;
      margin-right: 6px;
    }

    @keyframes p5FadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes bubblePop {
      0% { opacity: 0; transform: skewX(-10deg) scale(0.88); }
      60% { transform: skewX(-10deg) scale(1.04); }
      100% { opacity: 1; transform: skewX(-10deg) scale(1); }
    }
    @keyframes bgmPulse {
      from { transform: skewX(-8deg) scale(1); }
      to { transform: skewX(-8deg) scale(1.05); }
    }
    @keyframes phoneSlideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes blinkDots {
      0%, 20% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }
    .thinking-dots {
      animation: blinkDots 1.2s infinite;
      font-weight: 900;
      color: #ffdd59;
    }
  </style>
</head>
<body>

  <!-- 🎵 P5X 뮤직 플레이어 모달 -->
  <div id="music-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>

      <div class="p5x-player-card">

          <span class="p5x-tape-tag">NOW PLAYING</span>

        </div>

        <div id="current-track-title" class="track-title-display">재생 중인 곡 없음</div>

        <div class="p5x-controls">

      <div style="border-top: 1.5px dashed #444; padding-top: 8px; margin-top: 4px;">

        <select id="sched-category" style="width: 80px;">

        </div>

        <button class="btn-save" style="flex:1;" onclick="saveSettings()">저장</button>
        <button class="btn-cancel" onclick="closeSettings()">닫기</button>
      </div>
    </div>

  <script>
    const DEFAULT_PROMPT = `[캐릭터 기본 프로필: 유소명]
- 나이/신분: 이성주와 같은 대학교에 재학 중인 간호학과 대학생 (간호사를 꿈꿈).
- 외모/분위기: 단정하고 차분한 인상. 감정 기복이 크지 않고 담담하지만 묘하게 사람을 끌어당기는 분위기.
- 가치관/행동 특징:
  1. 자신만의 철학을 지키고 올바른 일을 행할 줄 안다.
  2. 상대방에 대해 더 알고자 하는 게 실례일 수 있다는 생각 때문에 남들에게는 더 다가가려 하지 않고 적당한 거리를 유지한다.
  3. 하지만 남친인 이성주에게는 완전히 개방적이고 적극적이다. 먼저 다가가 손을 잡거나 안길 만큼 솔직하다.
  4. 무뚝뚝하지만 누구보다 위로가 되는 말을 잘 해주고, 현실적이면서도 실질적으로 도움이 되는 말들을 건넨다.
  5. 가볍게 철학적인 이야기나 일상의 통찰로 성주에게 깊은 깨달음과 안도감을 준다.

    function initMusicPlayer() {

          document.getElementById('seek-bar').value = progress;
          document.getElementById('current-time-txt').innerText = formatTime(audio.currentTime);
        }
      });

      audio.addEventListener('loadedmetadata', () => {
        document.getElementById('total-time-txt').innerText = formatTime(audio.duration);
      });

      audio.addEventListener('ended', () => {
        if (repeatMode === 'one') {
          audio.currentTime = 0;
          audio.play();

          playNextTrack();

            updatePlayBtnState(false);
          }

      });

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

      const track = playlist[currentTrackIndex];

      audio.src = encodeURI(track.file);
      renderPlaylist();

          <button onclick="deleteTrack(${track.id})" style="background:none; border:none; color:#e60012; font-weight:900; cursor:pointer; font-size:1rem;">✕</button>

    function parseAiResponse(fullText) {
      let cleanText = fullText;
      let emotion = '기본';

      const tagMatch = fullText.match(/\[감정:([^\]]+)\]/);
      if (tagMatch) {
        emotion = tagMatch[1].trim();
        cleanText = fullText.replace(/\[감정:[^\]]+\]/g, '').trim();
      }

      const rawParts = cleanText.split(/((?:\*|\*\*|「)[\s\S]*?(?:\*|\*\*|」))/g);
      const items = [];

      rawParts.forEach(part => {
        if (!part) return;
        const trimmed = part.trim();
        if (!trimmed) return;

        if ((trimmed.startsWith('*') && trimmed.endsWith('*')) || (trimmed.startsWith('「') && trimmed.endsWith('」'))) {
          const raw = trimmed.replace(/^(\*+|\「)/, '').replace(/(\*+|\」)$/, '').trim();
          if (raw) items.push({ type: 'narration', text: `「 ${raw} 」` });
        } else {
          const dialogueMatches = trimmed.match(/"([^"]+)"/g);
          if (dialogueMatches && dialogueMatches.length > 0) {
            dialogueMatches.forEach(d => {
              const cleaned = d.replace(/^"+|"+$/g, '').trim();
              if (cleaned) items.push({ type: 'dialogue', text: cleaned });
            });
            const withoutQuotes = trimmed.replace(/"[^"]+"/g, '').trim();
            if (withoutQuotes && withoutQuotes.length > 1) {
              items.push({ type: 'dialogue', text: withoutQuotes });
            }
          } else {
            let dialogue = trimmed.replace(/^"+|"+$/g, '').trim();
            if (dialogue) items.push({ type: 'dialogue', text: dialogue });
          }
        }
      });

      return { emotion, items };
    }

    function renderMessage(role, text) {
      const group = document.createElement('div');
      group.className = `msg-group ${role}-group`;

      let cleanText = text;
      const tagMatch = text.match(/\[감정:([^\]]+)\]/);
      if (tagMatch) {
        if (role === 'ai') setBackgroundByTag(tagMatch[1].trim());
        cleanText = text.replace(/\[감정:[^\]]+\]/g, '').trim();
      }

      if (role === 'ai') {
        const avatarAnchor = document.createElement('div');
        avatarAnchor.className = 'ai-avatar-anchor';
        avatarAnchor.innerHTML = `
          <video class="ai-avatar-video" src="${currentVideoSrc}" autoplay muted loop playsinline></video>
          <div class="ai-star-badge">★MAX</div>
        `;
        group.appendChild(avatarAnchor);

        const info = document.createElement('div');
        info.className = 'ai-sender-info';
        info.innerHTML = `<span class="ai-sender-name">${settings.name || '유소명'}</span>`;
        group.appendChild(info);
      }

      const parts = cleanText.split(/((?:\*|\*\*|「)[\s\S]*?(?:\*|\*\*|」))/g);

      parts.forEach(part => {
        if (!part) return;
        const trimmed = part.trim();
        if (!trimmed) return;

        if ((trimmed.startsWith('*') && trimmed.endsWith('*')) || (trimmed.startsWith('「') && trimmed.endsWith('」'))) {
          const raw = trimmed.replace(/^(\*+|\「)/, '').replace(/(\*+|\」)$/, '').trim();
          const narEl = document.createElement('div');
          narEl.className = 'narration';
          narEl.textContent = `「 ${raw} 」`;
          group.appendChild(narEl);
        } else {
          let dialogue = trimmed.replace(/^"+|"+$/g, '').trim();
          if (!dialogue) return;
          const bubble = document.createElement('div');
          bubble.className = `p5-bubble ${role}-bubble`;
          bubble.innerHTML = `<span class="bubble-inner-text">${dialogue}</span>`;
          group.appendChild(bubble);
        }
      });
      return group;
    }

    async function playAiMessageSequence(fullText) {
      const chatBox = document.getElementById('chat-box');
      const { emotion, items } = parseAiResponse(fullText);

      setBackgroundByTag(emotion);

      const group = document.createElement('div');
      group.className = 'msg-group ai-group';

      const avatarAnchor = document.createElement('div');
      avatarAnchor.className = 'ai-avatar-anchor';
      avatarAnchor.innerHTML = `
        <video class="ai-avatar-video" src="${currentVideoSrc}" autoplay muted loop playsinline></video>
        <div class="ai-star-badge">★MAX</div>
      `;
      group.appendChild(avatarAnchor);

      const info = document.createElement('div');
      info.className = 'ai-sender-info';
      info.innerHTML = `<span class="ai-sender-name">${settings.name || '유소명'}</span>`;
      group.appendChild(info);

      chatBox.appendChild(group);
      chatBox.scrollTop = chatBox.scrollHeight;

      for (const item of items) {
        if (item.type === 'narration') {
          const narEl = document.createElement('div');
          narEl.className = 'narration';
          group.appendChild(narEl);

          for (let i = 0; i < item.text.length; i++) {
            narEl.textContent += item.text[i];
            chatBox.scrollTop = chatBox.scrollHeight;
            await new Promise(r => setTimeout(r, 26));
          }
          await new Promise(r => setTimeout(r, 300));
        } else if (item.type === 'dialogue') {
          const bubble = document.createElement('div');
          bubble.className = 'p5-bubble ai-bubble';
          bubble.innerHTML = `<span class="bubble-inner-text">${item.text}</span>`;
          group.appendChild(bubble);
          chatBox.scrollTop = chatBox.scrollHeight;

          const delay = Math.min(800, 480 + (item.text.length * 10));
          await new Promise(r => setTimeout(r, delay));
        }
      }
    }

    function renderChatRoom() {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';
      const list = currentRoom === 'daily' ? dailyHistory : schedHistory;

      if (list.length === 0) {
        let welcome = '';
        if (currentRoom === 'daily') {
          welcome = `[감정:기본] *강의실 앞 벤치에 앉아 전공 책을 읽다가 당신을 올려다보며 은은하게 미소 짓는다.* "성주야, 왔어? 보고 싶었어."`;
        } else {
          const pending = schedules.filter(s => !s.done);
          if (pending.length > 0) {
            welcome = `[감정:기본] *플래너를 톡톡 두드리며 당신을 빤히 바라본다.* "성주야, 왔어? 오늘 [${pending[0].title}] 하기로 했잖아. 이제 슬슬 준비해야지?"`;
          } else {
            welcome = `[감정:기본] *플래너를 펼쳐놓고 펜을 가볍게 굴리며 당신을 본다.* "성주야, 오늘 세워둔 목표들 확인해 볼까? 몸 컨디션은 무리 없지?"`;
          }
        }
        chatBox.appendChild(renderMessage('ai', welcome));
      } else {
        list.forEach(msg => {
          chatBox.appendChild(renderMessage(msg.role === 'user' ? 'user' : 'ai', msg.parts[0].text));
        });
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function clearCurrentHistory() {
      const roomName = currentRoom === 'daily' ? '일상 대화' : '일정 관리';
      if (confirm(`현재 [${roomName}] 방의 대화 기록을 비우시겠습니까?`)) {
        if (currentRoom === 'daily') {
          dailyHistory = [];
          localStorage.removeItem(STORAGE_KEY_DAILY);
        } else {
          schedHistory = [];
          localStorage.removeItem(STORAGE_KEY_SCHED_CHAT);
        }
        renderChatRoom();
        setBackgroundByTag('기본');
      }
    }

    function loadSchedules() {
      try { schedules = JSON.parse(localStorage.getItem(STORAGE_KEY_SCHEDULES)) || []; } catch(e) { schedules = []; }
      renderScheduleList();
    }

    function saveSchedules() {
      localStorage.setItem(STORAGE_KEY_SCHEDULES, JSON.stringify(schedules));
      renderScheduleList();
      syncSchedulesToGas();
    }

    function addSchedule() {
      const cat = document.getElementById('sched-category').value;
      const time = document.getElementById('sched-time').value;
      const title = document.getElementById('sched-title').value.trim();
      if (!title) return alert('목표 내용을 입력해 주세요!');

      schedules.push({ id: Date.now(), category: cat, time: time, title: title, done: false, lastNotifiedDate: '' });
      saveSchedules();
      document.getElementById('sched-title').value = '';
    }

    function toggleSchedule(id) {
      schedules = schedules.map(item => item.id === id ? { ...item, done: !item.done } : item);
      saveSchedules();
    }

    function deleteSchedule(id) {
      schedules = schedules.filter(item => item.id !== id);
      saveSchedules();
    }

    function renderScheduleList() {
      const listEl = document.getElementById('schedule-list');
      listEl.innerHTML = '';
      if (schedules.length === 0) {
        listEl.innerHTML = '<div style="color: #888; font-size: 0.82rem; text-align: center; padding: 15px 0;">등록된 일정이 없습니다.</div>';
        return;
      }
      schedules.forEach(item => {
        const div = document.createElement('div');
        div.className = `schedule-item ${item.done ? 'done' : ''}`;
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap: 8px;">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleSchedule(${item.id})">
            <div>
              <span class="sched-tag">${item.category}</span>
              <span style="font-size: 0.78rem; color:#aaa;">${item.time}</span>
              <div class="sched-text" style="font-size: 0.88rem; margin-top:2px;">${item.title}</div>
            </div>
          </div>
          <button onclick="deleteSchedule(${item.id})" style="background:none; border:none; color:#e60012; font-size:1.1rem; font-weight:900; cursor:pointer;">✕</button>
        `;
        listEl.appendChild(div);
      });
    }

    function openSchedule() { document.getElementById('schedule-modal').style.display = 'flex'; }
    function closeSchedule() { document.getElementById('schedule-modal').style.display = 'none'; }

    function setBackgroundByTag(tag) {
      const fileName = EMOTION_VIDEO_MAP[tag] || `${tag}.mp4`;
      if (fileName === currentVideoSrc) return;

      const v1 = document.getElementById('bg-video-1');
      const v2 = document.getElementById('bg-video-2');

      const nextVideo = activeLayer === 1 ? v2 : v1;
      const currentVideo = activeLayer === 1 ? v1 : v2;

      nextVideo.src = fileName;
      nextVideo.load();
      nextVideo.play().catch(() => {});

      nextVideo.oncanplay = () => {
        nextVideo.classList.add('active');
        currentVideo.classList.remove('active');
        activeLayer = activeLayer === 1 ? 2 : 1;
        currentVideoSrc = fileName;

        document.querySelectorAll('.ai-avatar-video, .p5x-star-avatar').forEach(el => {
          el.src = fileName;
          el.play().catch(() => {});
        });
        nextVideo.oncanplay = null;
      };

      nextVideo.onerror = () => {
        if (currentVideoSrc !== 'default.mp4') {
          nextVideo.src = 'default.mp4';
          nextVideo.load();
          nextVideo.play().catch(() => {});
          currentVideoSrc = 'default.mp4';
        }
      };
    }

    function exportData() {
      const payload = { version: 16, settings, dailyHistory, schedHistory, schedules, playlist };
      try {
        const jsonStr = JSON.stringify(payload);
        const b64 = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
        navigator.clipboard.writeText(b64).then(() => {
          alert('✅ 백업 코드가 클립보드에 복사되었습니다!');
        }).catch(() => prompt('백업 코드를 복사하세요:', b64));
      } catch (err) { alert('백업 실패: ' + err.message); }
    }

    function importData() {
      const code = prompt('백업 코드를 붙여넣어 주세요:');
      if (!code || !code.trim()) return;
      try {
        const jsonStr = decodeURIComponent(Array.prototype.map.call(atob(code.trim()), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const data = JSON.parse(jsonStr);
        settings = data.settings || settings;
        dailyHistory = data.dailyHistory || [];
        schedHistory = data.schedHistory || [];
        schedules = data.schedules || [];
        playlist = data.playlist || playlist;

        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
        localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(dailyHistory));
        localStorage.setItem(STORAGE_KEY_SCHED_CHAT, JSON.stringify(schedHistory));
        localStorage.setItem(STORAGE_KEY_SCHEDULES, JSON.stringify(schedules));
        localStorage.setItem(STORAGE_KEY_PLAYLIST, JSON.stringify(playlist));

        loadSettings();
        loadSchedules();
        renderPlaylist();
        updatePlayerTrackInfo();
        renderChatRoom();
        closeSettings();
        syncSchedulesToGas();
        alert('🎉 모든 데이터가 복원되었습니다!');
      } catch (err) { alert('⚠️ 복원 실패: 올바른 코드가 아닙니다.'); }
    }

    function toggleCleanMode() { document.body.classList.toggle('clean-mode'); }
    function handleBgClick() {
      if (document.body.classList.contains('clean-mode')) document.body.classList.remove('clean-mode');
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS));
        if (saved) {
          if (saved.name) settings.name = saved.name;
          if (saved.apiKey) settings.apiKey = saved.apiKey;
          if (saved.model) settings.model = saved.model;
          if (saved.gasUrl) settings.gasUrl = saved.gasUrl;
          if (saved.prompt) settings.prompt = saved.prompt;
        }
      } catch(e){}

      document.getElementById('setting-char-name').value = settings.name || '유소명';
      document.getElementById('setting-api-key').value = settings.apiKey || '';
      document.getElementById('setting-model').value = settings.model || 'gemini-3.5-flash-lite';
      document.getElementById('setting-gas-url').value = settings.gasUrl || '';
      document.getElementById('setting-prompt').value = settings.prompt || DEFAULT_PROMPT;
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function saveSettings() {
      settings.name = document.getElementById('setting-char-name').value.trim() || '유소명';
      settings.apiKey = document.getElementById('setting-api-key').value.trim();
      settings.model = document.getElementById('setting-model').value;
      settings.gasUrl = document.getElementById('setting-gas-url').value.trim();
      settings.prompt = document.getElementById('setting-prompt').value.trim() || DEFAULT_PROMPT;

      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
      closeSettings();
      syncSchedulesToGas();
      renderChatRoom();
      alert('설정이 저장되었습니다!');
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const userText = inputEl.value.trim();

      if (!userText) return;
      if (!settings.apiKey) {
        alert('우측 상단 MENU -> [환경설정]에서 Google AI Studio API 키를 입력해 주세요!');
        openSettings();
        return;
      }

      const chatBox = document.getElementById('chat-box');

      chatBox.appendChild(renderMessage('user', userText));
      chatBox.scrollTop = chatBox.scrollHeight;
      inputEl.value = '';
      sendBtn.disabled = true;

      const currentHistory = currentRoom === 'daily' ? dailyHistory : schedHistory;
      currentHistory.push({ role: 'user', parts: [{ text: userText }] });

      const typingIndicator = document.createElement('div');
      typingIndicator.className = 'msg-group ai-group';
      typingIndicator.id = 'ai-typing-temp';
      typingIndicator.innerHTML = `
        <div class="ai-avatar-anchor">
          <video class="ai-avatar-video" src="${currentVideoSrc}" autoplay muted loop playsinline></video>
          <div class="ai-star-badge">★MAX</div>
        </div>
        <div class="ai-sender-info">
          <span class="ai-sender-name">${settings.name || '유소명'}</span>
        </div>
        <div class="narration" style="opacity: 0.85;">
          <span>「 생각하는 중<span class="thinking-dots">...</span> 」</span>
        </div>
      `;
      chatBox.appendChild(typingIndicator);
      chatBox.scrollTop = chatBox.scrollHeight;

      let systemInstructionText = settings.prompt || DEFAULT_PROMPT;
      if (currentRoom === 'daily') {
        systemInstructionText += `\n\n[현재 채널: 💬 일상 대화방]
- 성주와의 애정 표현, 일상적인 대학 생활, 따뜻한 위로와 서툰 애교에 집중하세요.
- 일정을 굳이 캐묻지 말고, 성주와의 정서적 교감에 집중하세요.`;
      } else {
        const schedSummary = schedules.length > 0 
          ? "\n[성주의 등록 일정 현황]:\n" + schedules.map(s => `- [${s.category}] ${s.time} ${s.title} (${s.done ? '완료' : '미완료'})`).join("\n")
          : "\n[현재 등록된 일정 없음]";

        systemInstructionText += `\n\n[현재 채널: 📅 일정 & 건강 케어방]
${schedSummary}
[★ 소명이의 일정 케어 코칭 지침]
- 간호학도다운 세심한 시선으로 성주의 목표 수행(운동, 공부 등)과 장루/신체 컨디션을 집중 체크하세요.
- 대화할 때 "이제 ~할 시간이야", "~해야지?", "딴짓하지 말고 얼른 해", "약속했잖아"처럼 차분하면서도 확실하게 등을 떠미는 어조를 적극적으로 사용하세요.
- 미루거나 핑계를 대면 살짝 뾰로통하게 타이르고, 완료했을 때는 머리를 쓰다듬듯 진심으로 기특해하며 칭찬해 주세요.`;
      }

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${settings.model}:generateContent?key=${settings.apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstructionText }] },
            contents: currentHistory,
            generationConfig: { temperature: 0.85 }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'API 통신 오류');
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '[감정:기본] ...(가만히 바라본다)';

        const tempEl = document.getElementById('ai-typing-temp');
        if (tempEl) tempEl.remove();

        await playAiMessageSequence(reply);

        currentHistory.push({ role: 'model', parts: [{ text: reply }] });

        if (currentRoom === 'daily') {
          localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(dailyHistory));
        } else {
          localStorage.setItem(STORAGE_KEY_SCHED_CHAT, JSON.stringify(schedHistory));
        }

      } catch (err) {
        const tempEl = document.getElementById('ai-typing-temp');
        if (tempEl) tempEl.remove();
        chatBox.appendChild(renderMessage('ai', `[감정:기본] *살짝 곤란한 표정을 지으며* "통신에 문제가 생긴 것 같아: ${err.message}"`));
        chatBox.scrollTop = chatBox.scrollHeight;
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }
  </script>
</body>
</html>
