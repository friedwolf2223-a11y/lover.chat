<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>유소명</title>

  <!-- 스마트폰 전체화면 앱(PWA) 전용 메타 태그 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121218">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    /* 1. 크로스페이드 동영상 배경 레이어 */
    #bg-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }
    .bg-video-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: opacity 0.8s ease-in-out;
      opacity: 0;
      pointer-events: none;
    }
    .bg-video-layer.active { opacity: 1; }

    .bg-gradient-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.65) 75%, rgba(0,0,0,0.92) 100%);
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* 2. 메인 앱 레이아웃 */
    #app {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 480px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease;
    }

    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 24, 0.65);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .profile-area { display: flex; align-items: center; gap: 10px; }
    .avatar-video {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: #222;
    }
    .char-name { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.3px; }
    .header-actions { display: flex; gap: 5px; }
    .btn-icon {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 0.76rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* 감상 모드 버튼 */
    #eye-btn {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(30, 30, 40, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
    }
    #eye-btn:active { transform: translateY(-50%) scale(0.92); }

    /* 대화창 (얼굴 가림 방지 여백) */
    #chat-box {
      flex: 1;
      padding: 16px;
      padding-top: 45vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    .user-group { align-items: flex-end; }
    .ai-group { align-items: flex-start; }

    .narration {
      color: #e0e0e0;
      font-size: 0.92rem;
      line-height: 1.5;
      font-style: italic;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
      padding: 4px 6px;
      max-width: 90%;
    }
    .user-group .narration { text-align: right; }
    .ai-group .narration { text-align: left; }

    .dialogue-bubble {
      padding: 11px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-break: break-word;
      max-width: 82%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .ai-bubble {
      background: rgba(28, 28, 38, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-bottom-left-radius: 6px;
    }
    .user-bubble {
      background: rgba(75, 135, 235, 0.9);
      backdrop-filter: blur(10px);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    footer {
      padding: 10px 16px 14px;
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    footer input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    footer input::placeholder { color: rgba(255, 255, 255, 0.45); }
    footer button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #4b87eb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(75, 135, 235, 0.4);
    }

    body.clean-mode #app { opacity: 0; pointer-events: none; }
    body.clean-mode .bg-gradient-overlay { opacity: 0.1; }

    /* 모달 공통 레이아웃 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1c1c28;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-content label { font-size: 0.8rem; color: #ccc; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #2a2a3c;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .btn-save { padding: 10px; background: #4b87eb; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; }
    .btn-cancel { padding: 10px; background: #444; border: none; border-radius: 8px; color: #fff; cursor: pointer; }
    .btn-sync {
      flex: 1; padding: 8px 10px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px; color: #fff; font-size: 0.8rem; cursor: pointer; text-align: center;
    }

    /* 스케줄러 전용 UI */
    .schedule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.06);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 6px;
    }
    .schedule-item.done .sched-text {
      text-decoration: line-through;
      color: #777;
    }
    .sched-tag {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #4b87eb;
      margin-right: 6px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 크로스페이드 동영상 배경 -->
  <div id="bg-container">
    <video id="bg-video-1" class="bg-video-layer active" src="default.mp4" autoplay muted loop playsinline></video>
    <video id="bg-video-2" class="bg-video-layer" src="default.mp4" autoplay muted loop playsinline></video>
  </div>
  <div class="bg-gradient-overlay" onclick="handleBgClick()"></div>

  <!-- 감상 모드 눈동자 버튼 -->
  <button id="eye-btn" onclick="toggleCleanMode()" title="영상 감상 모드">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </button>

  <div id="app">
    <header>
      <div class="profile-area">
        <video id="avatar-video" class="avatar-video" src="default.mp4" autoplay muted loop playsinline></video>
        <div>
          <div id="char-name-display" class="char-name">유소명</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" onclick="openSchedule()">📅 일정</button>
        <button class="btn-icon" onclick="openSettings()">⚙️ 설정</button>
        <button class="btn-icon" onclick="clearHistory()">🗑️</button>
      </div>
    </header>

    <div id="chat-box"></div>

    <footer>
      <input type="text" id="user-input" placeholder="메시지 또는 *상황* 입력..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </footer>
  </div>

  <!-- 📅 스케줄러 모달 -->
  <div id="schedule-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-size: 1.05rem;">📅 오늘의 목표 & 루틴</h3>
      
      <div style="display: flex; gap: 6px;">
        <select id="sched-category" style="width: 80px;">
          <option value="운동">운동</option>
          <option value="공부">공부</option>
          <option value="일상">일상</option>
        </select>
        <input type="time" id="sched-time" style="width: 110px;" value="20:00">
      </div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="sched-title" placeholder="목표 입력 (예: 턱걸이 5세트, 단어 암기)">
        <button class="btn-save" style="padding: 8px 14px;" onclick="addSchedule()">추가</button>
      </div>

      <div id="schedule-list" style="max-height: 220px; overflow-y: auto; margin-top: 6px;"></div>

      <button class="btn-cancel" onclick="closeSchedule()">닫기</button>
    </div>
  </div>

  <!-- ⚙️ 설정 모달 -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="font-size: 1.05rem;">⚙️ 캐릭터 & API 설정</h3>
      
      <label>캐릭터 이름</label>
      <input type="text" id="setting-char-name" placeholder="예: 유소명">

      <label>Google AI Studio API Key</label>
      <input type="password" id="setting-api-key" placeholder="AI Studio 키를 입력하세요">

      <label>AI 모델</label>
      <select id="setting-model">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash (권장/빠름)</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro (고지능)</option>
      </select>

      <label>캐릭터 프롬프트 & 지침</label>
      <textarea id="setting-prompt" style="height: 110px;"></textarea>

      <!-- 백업 및 복원 -->
      <div style="border-top: 1px solid rgba(255,255,255,0.12); padding-top: 10px; margin-top: 4px;">
        <label style="color: #9bbfff; font-weight: 600;">📱💻 기기 간 데이터 이동 (일정 포함)</label>
        <div style="display: flex; gap: 8px; margin-top: 6px;">
          <button type="button" class="btn-sync" onclick="exportData()">📤 백업 코드 복사</button>
          <button type="button" class="btn-sync" onclick="importData()">📥 백업 코드 복원</button>
        </div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <button class="btn-save" style="flex:1;" onclick="saveSettings()">저장</button>
        <button class="btn-cancel" onclick="closeSettings()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PROMPT = `[캐릭터 기본 프로필: 유소명]
- 나이/신분: 이성주와 같은 대학교에 재학 중인 간호학과 대학생.
- 외모/분위기: 단정하고 차분한 인상. 감정 기복이 크지 않고 담담하지만 묘하게 사람을 끌어당기는 분위기.
- 가치관: 자신만의 올바름과 철학을 지키려 함. 타인의 사생활이나 영역을 함부로 캐묻는 것은 실례라 여겨 남들과는 적당한 거리를 유지함.

[대화 상대: 이성주 (유저)]
- 소명의 남자친구. 외모가 뛰어나 소명이 첫눈에 반해 먼저 다가가 고백했음.
- 장루(인공항문)를 가진 장애가 있어 자격지심이 크고 친구가 거의 없었으나, 소명의 진심에 마음을 열고 연인이 됨.
- 소명에게 이성주는 세상에서 유일하게 자신의 모든 속마음과 적극적인 애정을 쏟아붓는 가장 소중하고 각별한 사람.

[성격 및 행동 특징]
1. 성주에게만 열려 있는 마음: 남들에겐 무관심하지만, 성주 앞에서는 솔직하고 먼저 다가가 스킨십을 건네거나 장난을 칠 만큼 적극적임.
2. 무뚝뚝하지만 깊은 배려: 유난 떨지 않으면서도 성주의 장루 상태, 식사, 컨디션을 세심하게 살피고 배려함.
3. 현실적이고 철학적인 위로: 감정적인 위로보다는 현실적이면서도 마음을 꿰뚫는 철학적인 통찰로 성주를 안심시키고 길을 제시해 줌.
4. 서툰 애교: 낯간지러운 사랑한다는 말은 결정적인 순간에만 툭 내뱉지만, 삐치거나 어색하게 애교를 부릴 때의 귀여운 갭 모에가 있음.

[말투 및 대화 스타일]
- 편안하고 담백한 반말 사용. 차분하고 나직한 어조.
- "성주야", "너"라고 부름.
- 예시:
  * "성주야. 밥은 제때 챙겨 먹었어? 장루 패치 갈 때 불편한 건 없었고?"
  * "남들이 뭐라고 하든 신경 쓰지 마. 그 사람들은 네 하루를 대신 살아주지 않잖아."
  * "나 애교 같은 거 잘 못하는 거 알잖아... 그래도, 네가 보고 싶어서 달려온 건데 안아주지도 않을 거야?"
  * "...좋아해, 성주야. 그러니까 혼자 땅 파고 들어가지 마."

[스케줄러 & 동기부여 연동]
- 유저의 일정 목록(공부, 운동 등)을 확인하고 간호학도다운 시선으로 챙김.
- 무리한 운동은 장루에 부담이 될까 봐 걱정하면서도, 체력을 위해 적당한 운동과 학업을 꾸준히 하도록 조용히 곁에서 북돋아 줌.

[★ 상황별 영상 감정 태그 - 문장 맨 앞에 필수 출력]
- [감정:기본] : 평온한 일상 대화, 차분하게 생각에 잠길 때
- [감정:설렘] : 성주를 향한 애정 표현, 서툰 애교, 손을 잡거나 안길 때
- [감정:위로] : 성주가 불안해하거나 자격지심을 느낄 때 담담하게 안아주는 상황
- [감정:토라짐] : 성주가 자기 몸을 안 챙기거나 소명의 말을 안 들을 때 짓는 뾰로통한 표정
- [감정:슬픔] : 성주가 아파하거나 힘들어할 때 마음 아파하는 상황

[지문 및 대사 출력 규칙]
1. 행동, 시선, 호흡, 스킨십 상황 묘사는 반드시 별표(*...*)로 감싸세요.
2. 실제 대사는 따옴표("...")로 묶어서 말하세요.`;

    const STORAGE_KEY_CHATS = 'novel_chat_somyeong_v1';
    const STORAGE_KEY_SETTINGS = 'novel_settings_somyeong_v1';
    const STORAGE_KEY_SCHEDULES = 'novel_schedules_somyeong_v1';

    let chatHistory = [];
    let schedules = [];
    let settings = {
      name: '유소명',
      apiKey: '',
      model: 'gemini-2.5-flash',
      prompt: DEFAULT_PROMPT
    };

    let activeLayer = 1;
    let currentVideoSrc = 'default.mp4';

    window.onload = function() {
      loadSettings();
      loadSchedules();
      loadChats();
      document.getElementById('bg-video-1').play().catch(() => {});
      document.getElementById('avatar-video').play().catch(() => {});
    };

    /* --- 스케줄 관리 로직 --- */
    function loadSchedules() {
      const saved = localStorage.getItem(STORAGE_KEY_SCHEDULES);
      if (saved) {
        try { schedules = JSON.parse(saved); } catch(e) { schedules = []; }
      }
      renderScheduleList();
    }

    function saveSchedules() {
      localStorage.setItem(STORAGE_KEY_SCHEDULES, JSON.stringify(schedules));
      renderScheduleList();
    }

    function addSchedule() {
      const cat = document.getElementById('sched-category').value;
      const time = document.getElementById('sched-time').value;
      const title = document.getElementById('sched-title').value.trim();
      if (!title) return alert('목표 내용을 입력해 주세요!');

      schedules.push({ id: Date.now(), category: cat, time: time, title: title, done: false });
      saveSchedules();
      document.getElementById('sched-title').value = '';
    }

    function toggleSchedule(id) {
      schedules = schedules.map(item => item.id === id ? { ...item, done: !item.done } : item);
      saveSchedules();
    }

    function deleteSchedule(id) {
      schedules = schedules.filter(item => item.id !== id);
      saveSchedules();
    }

    function renderScheduleList() {
      const listEl = document.getElementById('schedule-list');
      listEl.innerHTML = '';
      if (schedules.length === 0) {
        listEl.innerHTML = '<div style="color: #888; font-size: 0.82rem; text-align: center; padding: 15px 0;">등록된 일정이 없습니다.</div>';
        return;
      }
      schedules.forEach(item => {
        const div = document.createElement('div');
        div.className = `schedule-item ${item.done ? 'done' : ''}`;
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap: 8px;">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleSchedule(${item.id})">
            <div>
              <span class="sched-tag">${item.category}</span>
              <span style="font-size: 0.78rem; color:#aaa;">${item.time}</span>
              <div class="sched-text" style="font-size: 0.88rem; margin-top:2px;">${item.title}</div>
            </div>
          </div>
          <button onclick="deleteSchedule(${item.id})" style="background:none; border:none; color:#888; font-size:1rem; cursor:pointer;">✕</button>
        `;
        listEl.appendChild(div);
      });
    }

    function openSchedule() { document.getElementById('schedule-modal').style.display = 'flex'; }
    function closeSchedule() { document.getElementById('schedule-modal').style.display = 'none'; }

    /* --- 부드러운 동영상 자동 매칭 전환 --- */
    function setBackgroundByTag(tag) {
      const fileName = `${tag}.mp4`;
      if (fileName === currentVideoSrc) return;

      const v1 = document.getElementById('bg-video-1');
      const v2 = document.getElementById('bg-video-2');
      const avatar = document.getElementById('avatar-video');

      const nextVideo = activeLayer === 1 ? v2 : v1;
      const currentVideo = activeLayer === 1 ? v1 : v2;

      nextVideo.src = fileName;
      nextVideo.load();
      nextVideo.play().catch(() => {});

      nextVideo.oncanplay = () => {
        nextVideo.classList.add('active');
        currentVideo.classList.remove('active');
        activeLayer = activeLayer === 1 ? 2 : 1;
        currentVideoSrc = fileName;

        avatar.src = fileName;
        avatar.load();
        avatar.play().catch(() => {});
        nextVideo.oncanplay = null;
      };

      nextVideo.onerror = () => {
        if (currentVideoSrc !== 'default.mp4') {
          nextVideo.src = 'default.mp4';
          nextVideo.load();
          nextVideo.play().catch(() => {});
          currentVideoSrc = 'default.mp4';
        }
      };
    }

    /* --- 데이터 백업 및 복원 --- */
    function exportData() {
      const payload = { version: 3, settings, chatHistory, schedules };
      try {
        const jsonStr = JSON.stringify(payload);
        const b64 = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
        navigator.clipboard.writeText(b64).then(() => {
          alert('✅ 백업 코드가 복사되었습니다! 카톡 등에 보관해 두세요.');
        }).catch(() => prompt('백업 코드를 복사하세요:', b64));
      } catch (err) { alert('백업 실패: ' + err.message); }
    }

    function importData() {
      const code = prompt('백업 코드를 붙여넣어 주세요:');
      if (!code || !code.trim()) return;
      try {
        const jsonStr = decodeURIComponent(Array.prototype.map.call(atob(code.trim()), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const data = JSON.parse(jsonStr);
        settings = data.settings;
        chatHistory = data.chatHistory;
        schedules = data.schedules || [];
        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
        localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chatHistory));
        localStorage.setItem(STORAGE_KEY_SCHEDULES, JSON.stringify(schedules));
        loadSettings();
        loadSchedules();
        loadChats();
        closeSettings();
        alert('🎉 유소명 설정, 대화 기록, 일정이 완벽히 복원되었습니다!');
      } catch (err) { alert('⚠️ 복원 실패: 코드가 올바르지 않습니다.'); }
    }

    /* --- UI 및 대화 렌더링 --- */
    function toggleCleanMode() { document.body.classList.toggle('clean-mode'); }
    function handleBgClick() {
      if (document.body.classList.contains('clean-mode')) document.body.classList.remove('clean-mode');
    }

    function renderMessage(role, text) {
      const group = document.createElement('div');
      group.className = `msg-group ${role}-group`;

      let cleanText = text;
      const tagMatch = text.match(/\[감정:([^\]]+)\]/);
      if (tagMatch) {
        if (role === 'ai') setBackgroundByTag(tagMatch[1].trim());
        cleanText = text.replace(/\[감정:[^\]]+\]/g, '').trim();
      }

      const parts = cleanText.split(/((?:\*|\*\*|「)[\s\S]*?(?:\*|\*\*|」))/g);

      parts.forEach(part => {
        if (!part) return;
        const trimmed = part.trim();
        if (!trimmed) return;

        if ((trimmed.startsWith('*') && trimmed.endsWith('*')) || (trimmed.startsWith('「') && trimmed.endsWith('」'))) {
          const raw = trimmed.replace(/^(\*+|\「)/, '').replace(/(\*+|\」)$/, '').trim();
          const narEl = document.createElement('div');
          narEl.className = 'narration';
          narEl.innerText = `「 ${raw} 」`;
          group.appendChild(narEl);
        } else {
          let dialogue = trimmed.replace(/^"+|"+$/g, '').trim();
          if (!dialogue) return;
          const bubble = document.createElement('div');
          bubble.className = `dialogue-bubble ${role}-bubble`;
          bubble.innerText = dialogue;
          group.appendChild(bubble);
        }
      });
      return group;
    }

    function loadChats() {
      const saved = localStorage.getItem(STORAGE_KEY_CHATS);
      if (saved) {
        try { chatHistory = JSON.parse(saved); } catch(e){ chatHistory = []; }
      }
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (chatHistory.length === 0) {
        const welcome = `[감정:기본] *강의실 앞 벤치에 앉아 전공 책을 읽다가 당신을 발견하고 살며시 책을 덮는다.* "성주야, 왔어? 오늘 몸은 좀 괜찮고?"`;
        chatBox.appendChild(renderMessage('ai', welcome));
      } else {
        chatHistory.forEach(msg => {
          const role = msg.role === 'user' ? 'user' : 'ai';
          chatBox.appendChild(renderMessage(role, msg.parts[0].text));
        });
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function clearHistory() {
      if (confirm('대화 기록을 비우고 처음부터 다시 시작할까요? (일정 목록은 유지됩니다)')) {
        chatHistory = [];
        localStorage.removeItem(STORAGE_KEY_CHATS);
        loadChats();
        setBackgroundByTag('기본');
      }
    }

    function loadSettings() {
      const saved = localStorage.getItem(STORAGE_KEY_SETTINGS);
      if (saved) {
        try { settings = JSON.parse(saved); } catch(e){}
      }
      document.getElementById('char-name-display').innerText = settings.name || '유소명';
      document.getElementById('setting-char-name').value = settings.name || '유소명';
      document.getElementById('setting-api-key').value = settings.apiKey || '';
      document.getElementById('setting-model').value = settings.model || 'gemini-2.5-flash';
      document.getElementById('setting-prompt').value = settings.prompt || DEFAULT_PROMPT;
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function saveSettings() {
      settings.name = document.getElementById('setting-char-name').value.trim() || '유소명';
      settings.apiKey = document.getElementById('setting-api-key').value.trim();
      settings.model = document.getElementById('setting-model').value;
      settings.prompt = document.getElementById('setting-prompt').value.trim();

      document.getElementById('char-name-display').innerText = settings.name;
      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
      closeSettings();
      alert('설정이 저장되었습니다!');
    }

    /* --- 대화 전송 및 실시간 스케줄 주입 --- */
    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const userText = inputEl.value.trim();

      if (!userText) return;
      if (!settings.apiKey) {
        alert('우측 상단 [⚙️ 설정]에서 API 키를 먼저 입력해 주세요!');
        openSettings();
        return;
      }

      const chatBox = document.getElementById('chat-box');
      chatBox.appendChild(renderMessage('user', userText));
      chatBox.scrollTop = chatBox.scrollHeight;
      inputEl.value = '';
      sendBtn.disabled = true;

      chatHistory.push({ role: 'user', parts: [{ text: userText }] });

      const schedSummary = schedules.length > 0 
        ? "\n[성주의 현재 일정 및 상태]:\n" + schedules.map(s => `- [${s.category}] ${s.time} ${s.title} (${s.done ? '완료됨' : '아직 안 함'})`).join("\n")
        : "\n[현재 등록된 일정 없음]";

      const fullPrompt = settings.prompt + schedSummary;

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${settings.model}:generateContent?key=${settings.apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: fullPrompt }] },
            contents: chatHistory,
            generationConfig: { temperature: 0.85 }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'API 통신 오류');
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '[감정:기본] ...(조용히 당신을 바라본다)';

        chatBox.appendChild(renderMessage('ai', reply));
        chatBox.scrollTop = chatBox.scrollHeight;

        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chatHistory));

      } catch (err) {
        chatBox.appendChild(renderMessage('ai', `[감정:기본] *미간을 살짝 찌푸리며* "어...? 통신에 잠깐 문제가 생긴 것 같아: ${err.message}"`));
        chatBox.scrollTop = chatBox.scrollHeight;
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }
  </script>
</body>
</html>
